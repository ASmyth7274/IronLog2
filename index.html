  return card;
}

/* ==========================================================================
   MECHANICS — making machine loads comparable to free weights
   --------------------------------------------------------------------------
   A machine's stack number is not the load your muscles see: levers, pulleys
   and angled sleds all sit between the plates and your hands. The honest way
   to recover the real load is conservation of work. Over one rep:

       force_at_hands × distance_hands = weight × VERTICAL rise of the weight

   so   force_at_hands = weight × (vertical weight travel / handle travel).

   That single rule covers every case, which is why the plotter only asks you
   to draw two paths — where your hands travel, and where the load travels:
     · plate-loaded lever  — load rises less than the handle → ratio < 1
     · 2:1 pulley cable    — stack rises half as far          → ratio ≈ 0.5
     · 45° leg-press sled  — only the vertical component lifts → ratio ≈ 0.71
     · barbell / dumbbell  — the load IS the hands            → ratio = 1
   Gravity only does work vertically, so a sled's angle falls straight out of
   the geometry — nothing extra to enter.

   Everything here is opt-in. An exercise with no `mech` profile scores exactly
   as it did before, so existing databases and backups are untouched.
   ========================================================================== */
const MECH_KINDS=[['lever','Plate-loaded lever'],['cable','Cable / pulley stack'],
  ['sled','Angled sled'],['direct','Direct (load = handle)']];
const MECH_POS=[['seated','Seated'],['standing','Standing'],['lying','Lying'],['incline','Incline']];
// typical full working range at the hands/feet, in cm, by primary muscle —
// only ever used as a gentle partial-ROM correction (hard-capped below)
const ROM_REF={Chest:42,Back:45,Shoulders:45,Biceps:35,Triceps:35,Forearms:15,
  Quads:50,Hamstrings:40,Glutes:40,Calves:14,Abs:30,Traps:20,
  'Front Delts':45,'Side Delts':50,'Rear Delts':40,Adductors:35,Abductors:35,
  'Lower Back':35,Obliques:30};
const FIG_UNITS=62;   // rig units spanned by a standing figure — the scale key
const cmPerUnit=()=>(S.set.heightCm||DEF.heightCm)/FIG_UNITS;

function mechRatio(ex){
  const r=ex&&ex.mech&&ex.mech.ratio;
  return typeof r==='number'&&isFinite(r)&&r>0?r:null;
}
const isCalibrated=ex=>mechRatio(ex)!=null;
// Partial ranges flatter the number on the stack. Compare the plotted travel
// with a typical full range and nudge — clamped to ±10/15 % so a rough plot
// can never dominate the score, only refine it.
function romFactor(ex){
  const rom=ex&&ex.mech&&ex.mech.romCm;
  const ref=ex&&ROM_REF[ex.m];
  if(!(rom>0)||!ref)return 1;
  return Math.max(.85,Math.min(1.1,Math.sqrt(rom/ref)));
}
// Does this exercise produce a number the bodyweight standards can read?
function strengthEligible(ex){
  if(!ex||isCardio(ex))return false;
  return STR_EQUIP.has(ex.e)||isCalibrated(ex);
}
/* THREE LOAD DOMAINS — keep them straight, mixing them up is how numbers rot.

   loadOf()       the weight AS TYPED (plus bodyweight on BW lifts). Identity
                  numbers only: set rows, PREV, top set, weight/e1RM records,
                  history lines. A per-side lift must never print a
                  "Dumbbell Curl PR — 60 kg" that you never held.

   workLoad()     total load actually moved: per-side doubling and machine
                  leverage applied. EVERY tonnage aggregate uses this — session
                  volume, muscle balance, volume records — because tonnage is
                  only meaningful if a dumbbell press and a barbell press can be
                  added together.

   strengthLoad() workLoad plus the partial-ROM correction. Strength score only,
                  where the comparison is against bodyweight standards.       */
function workLoad(ex,st){
  let w=loadOf(ex,st);
  const r=mechRatio(ex);
  if(r!=null)w*=r;              // stack load → load at the hands
  if(ex&&ex.uni)w*=2;           // one side logged → both sides were moved
  return w;
}
function strengthLoad(ex,st){return workLoad(ex,st)*romFactor(ex);}
// one-line human summary for exercise rows / sheets
function mechSummary(ex){
  const bits=[];
  if(ex&&ex.uni)bits.push('per side ×2');
  const r=mechRatio(ex);
  if(r!=null){
    bits.push('leverage ×'+r.toFixed(2));
    if(ex.mech.romCm>0)bits.push(Math.round(ex.mech.romCm)+' cm ROM');
  }
  return bits.join(' · ');
}
// machine-ish lifts you have actually logged but never calibrated — these are
// the ones sitting outside the strength score, surfaced on the Progress tab
function uncalibratedMachines(){
  const logged=new Set();
  for(const w of S.workouts)for(const en of w.exs)logged.add(en.exId);
  return [...logged].map(id=>S.ex.get(id))
    .filter(x=>x&&!isCardio(x)&&!STR_EQUIP.has(x.e)&&!isCalibrated(x))
    .sort((a,b)=>a.name.localeCompare(b.name));
}

/* ==========================================================================
   STRENGTH PROFILE — radar + overall score
   Best est. 1RM per muscle ÷ (bodyweight × reference multiplier) × 100.
   100 ≈ advanced ("Pro"+). Machines join once calibrated (see MECHANICS).
   ========================================================================== */
const STR_REF={Chest:1.25,Back:1.5,Shoulders:.85,Biceps:.6,Triceps:.9,Forearms:.7,Quads:1.8,Hamstrings:1.4,Glutes:2,Calves:1.6,Abs:.6,Traps:1.6,
  'Front Delts':.8,'Side Delts':.5,'Rear Delts':.5,'Adductors':1.2,'Abductors':1,'Lower Back':1.4,'Obliques':.6};
// Free-weight equipment is comparable to the standards as logged. Everything
// else (machines, cables, bands) needs a calibration before it can join —
// see the MECHANICS section for how the plotted geometry supplies one.
const STR_EQUIP=new Set(['Barbell','Dumbbell','Smith Machine','Bodyweight','Kettlebell']);
const RADAR_MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes'];
function strengthProfile(){
  const bwEntry=[...S.body].filter(b=>b.key==='Weight').sort((a,b)=>b.date-a.date)[0];
  const bw=bwEntry?bwEntry.value:(S.set.unit==='kg'?75:165);
  const best={};
  for(const w of S.workouts)for(const en of w.exs){
    const ex=S.ex.get(en.exId);
    if(!strengthEligible(ex))continue;
    for(const st of en.sets){
      if(st.t==='W'||!st.r)continue;
      const eff=strengthLoad(ex,st);   // BW lifts + machine leverage + per-side doubling
      if(eff<=0)continue;
      const e=epley(eff,st.r);
      if(!best[ex.m]||e>best[ex.m].v)best[ex.m]={v:e,name:ex.name};
    }
  }
  const per={};
  const scale=S.set.strScale||1;   // user-tunable standards difficulty
  for(const m of MUSCLES)per[m]=best[m]&&STR_REF[m]?Math.round(best[m].v/(bw*STR_REF[m]*scale)*100):0;
  // granular groups feed their parent's radar axis (best of parent/children)
  const radar={};
  for(const m of RADAR_MUSCLES)radar[m]=per[m]||0;
  for(const[g,parent]of Object.entries(REGION))
    if(radar[parent]!=null&&(per[g]||0)>radar[parent])radar[parent]=per[g];
  const any=RADAR_MUSCLES.some(m=>radar[m]>0);
  const score=any?Math.round(RADAR_MUSCLES.reduce((t,m)=>t+Math.min(radar[m],140),0)/RADAR_MUSCLES.length):0;
  return {per,radar,score,bw,hasBw:!!bwEntry,best,any};
}
const strengthLabel=s=>s<20?'Noob':s<40?'Novice':s<65?'Pro':s<85?'Master':s<105?'Olympian':'Superhuman';
function drawRadar(cv,sp){

function radarFX(box){

/* ==========================================================================
   SCHEDULE — rotating cycles and fixed weeks, with reminders
   --------------------------------------------------------------------------
   Two modes, because "my split" means different things to different people:
     cycle — an N-day rotation that ignores the calendar. Upper A · Lower A ·
             Rest · Upper B · Lower B · Rest repeats forever from an anchor
             date, so a 6-day cycle drifts through the week exactly as it
             should. This is the mode most people actually train.
     week  — fixed weekdays (Mon leg day, etc.) for calendar-locked splits.
   Day slots reference templates by id, so renaming or editing a template
   flows through automatically; a slot whose template was deleted degrades to
   a plain labelled day rather than breaking the schedule.
   ========================================================================== */
const SCHED_PRESETS=[
  {name:'2 on · 1 off — Upper/Lower, A then B',mode:'cycle',
    days:['Upper A','Lower A','Rest','Upper B','Lower B','Rest']},
  {name:'Push · Pull · Legs · Rest',mode:'cycle',days:['Push','Pull','Legs','Rest']},
  {name:'Upper · Lower · Rest',mode:'cycle',days:['Upper','Lower','Rest']},
  {name:'Full body, every other day',mode:'cycle',days:['Full body','Rest']},
  {name:'Fixed week (Mon–Sun)',mode:'week',
    days:['Upper','Lower','Rest','Upper','Lower','Rest','Rest']},
];
const WEEKDAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const midnight=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();};
// whole days between two local midnights; the round() absorbs DST's ±1 h
const daysBetween=(a,b)=>Math.round((midnight(b)-midnight(a))/864e5);
const dateKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
function schedNorm(s){
  if(!s||!Array.isArray(s.days)||!s.days.length)return null;
  return s;
}
// which slot falls on a given date
function schedFor(ts){
  const s=schedNorm(S.set.sched);
  if(!s||!s.on)return null;
  const n=s.days.length;
  let idx;
  if(s.mode==='week')idx=(new Date(ts).getDay()+6)%7;      // Mon = 0
  else idx=((daysBetween(s.anchor||Date.now(),ts)%n)+n)%n;
  if(idx>=n)return null;
  const day=s.days[idx];
  if(!day)return null;
  return {idx,day,tpl:day.tplId?S.templates.find(t=>t.id===day.tplId)||null:null};
}
const trainedOn=ts=>S.workouts.some(w=>daysBetween(w.finishedAt,ts)===0);
function schedLabel(d){
  if(!d)return '';
  return d.day.rest?'Rest day':(d.tpl?d.tpl.name:d.day.label||'Training');
}
/* ---- Log-page card: what today is, what tomorrow is, one tap to start ---- */
function scheduleCard(){
  const s=schedNorm(S.set.sched);
  if(!s||!s.on)return null;
  const today=schedFor(Date.now()),tom=schedFor(Date.now()+864e5);
  if(!today)return null;
  const done=trainedOn(Date.now());
  const card=h('section',{class:'card'});
  card.append(h('div',{class:'row',style:'margin-bottom:10px'},
    h('h3',{class:'grow',style:'margin-bottom:0'},'Today’s plan 🗓️'),
    h('button',{class:'btn sm inline',style:'flex:0 0 auto',onclick:scheduleSheet},'Edit')));
  card.append(h('div',{class:'sched-today'+(today.day.rest?' rest':'')},schedLabel(today)));
  if(today.day.rest){
    card.append(h('p',{class:'tiny dim',style:'margin:2px 0 0'},
      'Scheduled rest — recovery is where the adaptation happens. Tomorrow: '+schedLabel(tom)+'.'));
  }else if(done){
    card.append(h('p',{class:'tiny dim',style:'margin:2px 0 0'},
      '✅ Done for today. Up next: '+schedLabel(tom)+'.'));
  }else{
    card.append(h('p',{class:'tiny dim',style:'margin:2px 0 8px'},'Then tomorrow: '+schedLabel(tom)+'.'));
    if(today.tpl)card.append(h('button',{class:'btn primary sm',onclick:()=>startFromTemplate(today.tpl)},
      'Start '+today.tpl.name));
    else card.append(h('button',{class:'btn sm',onclick:()=>{
      scheduleSheet();
    }},'Link a template to this day'));
  }
  return card;
}
/* ---- editor ---- */
function scheduleSheet(){
  // edit a copy so backing out of the sheet doesn't leave a half-built split
  let s=S.set.sched?JSON.parse(JSON.stringify(S.set.sched)):null;
  const body=h('div');
  const commit=async()=>{S.set.sched=s;await saveSettings();};

  const mkDays=(names,mode)=>names.map(n=>{
    const rest=/^rest/i.test(n);
    const tpl=rest?null:S.templates.find(t=>t.name.toLowerCase()===n.toLowerCase());
    return rest?{rest:1,label:'Rest'}:{label:n,tplId:tpl?tpl.id:null};
  });

  function dayMenu(i){
    const d=s.days[i];
    const nameIn=h('input',{class:'in',value:d.label||'',placeholder:'e.g. Upper A'});
    const rows=h('div');
    const paint=()=>{
      rows.replaceChildren(
        h('span',{class:'lbl'},'Template'),
        ...(S.templates.length?S.templates.map(t=>h('div',{class:'lrow'},
          h('div',{class:'grow small'+(d.tplId===t.id?' bold':'')},t.name),
          h('button',{class:'btn sm inline',style:'flex:0 0 auto',onclick:()=>{
            d.tplId=d.tplId===t.id?null:t.id;
            if(d.tplId){d.rest=0;delete d.rest;if(!nameIn.value.trim())nameIn.value=t.name;}
            paint();
          }},d.tplId===t.id?'Linked ✓':'Link')))
          :[h('p',{class:'small dim',style:'padding:6px 2px'},'No templates yet — build one on the Templates tab and link it here.')]));
    };
    paint();
    const close2=sheet('Day '+(i+1),h('div',{},
      h('span',{class:'lbl'},'Name'),nameIn,
      h('div',{class:'mt12'},seg([['train','Training day'],['rest','Rest day']],d.rest?'rest':'train',v=>{
        if(v==='rest'){d.rest=1;d.tplId=null;if(!d.label||/^(upper|lower|push|pull|legs|full)/i.test(d.label))d.label='Rest';}
        else delete d.rest;
        nameIn.value=d.label||'';
        paint();
      })),
      rows,
      h('button',{class:'btn primary mt12',onclick:async()=>{
        d.label=nameIn.value.trim()||(d.rest?'Rest':'Training');
        await commit();close2();render();renderLog();
      }},'Save day'),
      h('div',{class:'row mt8',style:'gap:8px'},
        i>0?h('button',{class:'btn sm',onclick:async()=>{
          [s.days[i-1],s.days[i]]=[s.days[i],s.days[i-1]];await commit();close2();render();
        }},'↑ Move up'):null,
        i<s.days.length-1?h('button',{class:'btn sm',onclick:async()=>{
          [s.days[i+1],s.days[i]]=[s.days[i],s.days[i+1]];await commit();close2();render();
        }},'↓ Move down'):null),
      s.mode==='cycle'&&s.days.length>1?h('button',{class:'btn danger mt8',onclick:async()=>{
        s.days.splice(i,1);await commit();close2();render();renderLog();
      }},'Delete day'):null));
  }

  function render(){
    body.replaceChildren();
    if(!s){
      body.append(h('p',{class:'small dim',style:'margin:2px 2px 12px;line-height:1.5'},
        'Pick a split to start from — you can rename days, link templates and reorder afterwards.'));
      for(const p of SCHED_PRESETS)body.append(h('button',{class:'btn mt8',onclick:async()=>{
        s={on:1,mode:p.mode,days:mkDays(p.days,p.mode),anchor:midnight(Date.now()),
          remind:0,at:'17:30',lastNotif:''};
        await commit();render();renderLog();
      }},p.name));
      return;
    }
    // on/off
    const onT=h('button',{class:'tgl'+(s.on?' on':''),onclick:async()=>{
      s.on=s.on?0:1;onT.classList.toggle('on',!!s.on);await commit();renderLog();
    }});
    body.append(h('div',{class:'lrow'},h('div',{class:'grow bold'},'Schedule on'),onT));
    body.append(h('span',{class:'lbl'},'Type'),
      seg([['cycle','Rotating cycle'],['week','Fixed weekdays']],s.mode,async v=>{
        s.mode=v;
        if(v==='week'){
          while(s.days.length<7)s.days.push({rest:1,label:'Rest'});
          s.days=s.days.slice(0,7);
        }
        await commit();render();renderLog();
      }),
      h('p',{class:'tiny dim',style:'margin:6px 2px 0;line-height:1.5'},
        s.mode==='cycle'
          ?'Repeats forever regardless of what day of the week it is — a 6-day cycle deliberately drifts through the calendar.'
          :'Locked to weekdays: the same plan every Monday, Tuesday and so on.'));
    // day list
    body.append(h('span',{class:'lbl'},s.mode==='week'?'Week':'Cycle ('+s.days.length+' days)'));
    const todayIdx=s.on?(schedFor(Date.now())||{}).idx:-1;
    s.days.forEach((d,i)=>{
      const isToday=i===todayIdx;
      body.append(h('div',{class:'lrow'+(isToday?' sched-now':''),onclick:()=>dayMenu(i)},
        h('div',{class:'sched-num'},s.mode==='week'?WEEKDAYS[i]:String(i+1)),
        h('div',{class:'grow'},
          h('div',{class:'bold small'},d.rest?'Rest':(d.label||'Training')),
          h('div',{class:'tiny dim'},d.rest?'Recovery'
            :(d.tplId?(S.templates.find(t=>t.id===d.tplId)||{name:'Template deleted — tap to relink'}).name:'No template linked'))),
        isToday?h('span',{class:'mech-tag'},'TODAY'):null,
        h('span',{class:'dim'},'›')));
    });
    if(s.mode==='cycle')body.append(h('button',{class:'btn sm mt8',onclick:async()=>{
      s.days.push({label:'Training',tplId:null});await commit();render();
    }},'+ Add day to cycle'));
    // anchor
    if(s.mode==='cycle'){
      body.append(h('span',{class:'lbl'},'Day 1 of the cycle fell on'),
        h('input',{class:'in',type:'date',value:dateKey(s.anchor||Date.now()),
          onchange:async e=>{
            const v=e.target.value;
            if(!v)return;
            const[y,mo,dd]=v.split('-').map(Number);
            s.anchor=new Date(y,mo-1,dd).getTime();
            await commit();render();renderLog();
          }}),
        h('p',{class:'tiny dim',style:'margin:5px 2px 0'},
          'Shift this to re-sync the rotation if you skip or add a session.'));
    }
    // reminder
    const rt=h('button',{class:'tgl'+(s.remind?' on':''),onclick:async()=>{
      if(!s.remind){
        const ns=notifSupport();
        if(!ns.ok){toast(ns.why);return;}
        let perm=Notification.permission;
        if(perm==='default')perm=await Notification.requestPermission();
        if(perm!=='granted'){toast(perm==='denied'?'Blocked — allow notifications in browser settings':'Permission not granted');return;}
        s.remind=1;
      }else s.remind=0;
      rt.classList.toggle('on',!!s.remind);
      await commit();
    }});
    body.append(h('span',{class:'lbl'},'Reminder'),
      h('div',{class:'lrow'},h('div',{class:'grow'},'Remind me on training days'),rt),
      h('div',{class:'lrow'},h('div',{class:'grow'},'Time'),
        h('input',{class:'in',type:'time',style:'width:130px;flex:0 0 auto',value:s.at||'17:30',
          onchange:async e=>{s.at=e.target.value||'17:30';s.lastNotif='';await commit();}})),
      h('p',{class:'tiny dim',style:'margin:4px 2px 0;line-height:1.5'},
        'Fires when the app is open, or the next time you open it after the reminder time — a web app can’t wake itself while it is closed. On iPhone it also needs HTTPS and Add to Home Screen (iOS 16.4+). Rest days and days you have already trained stay silent.'));
    // next 7 days preview
    body.append(h('span',{class:'lbl'},'Next 7 days'));
    const prev=h('div',{class:'sched-prev'});
    for(let i=0;i<7;i++){
      const ts=Date.now()+i*864e5,d=schedFor(ts);
      prev.append(h('div',{class:'sp-cell'+(d&&d.day.rest?' rest':'')},
        h('div',{class:'sp-d'},i===0?'Today':new Date(ts).toLocaleDateString(undefined,{weekday:'short'})),
        h('div',{class:'sp-n'},d?(d.day.rest?'Rest':schedLabel(d)):'—')));
    }
    body.append(prev);
    body.append(h('button',{class:'btn danger mt12',onclick:async()=>{
      if(await ask('Delete schedule?','Your templates and workouts are untouched — only the plan is removed.','Delete',true)){
        s=null;S.set.sched=null;await saveSettings();render();renderLog();
      }
    }},'Delete schedule'));
  }
  render();
  sheet('Training schedule',body);
}
/* ---- reminder tick: called once a minute from the boot interval ---- */
async function schedTick(){
  const s=schedNorm(S.set.sched);
  if(!s||!s.on||!s.remind)return;
  const key=dateKey(Date.now());
  if(s.lastNotif===key)return;
  const[hh,mm]=String(s.at||'17:30').split(':').map(Number);
  const due=new Date();due.setHours(hh||0,mm||0,0,0);
  if(Date.now()<due.getTime())return;
  const d=schedFor(Date.now());
  if(!d||d.day.rest)return;          // never nag on a rest day
  if(trainedOn(Date.now()))return;   // …or once the session is already logged
  s.lastNotif=key;
  await saveSettings();
  pushNotif('Training day — '+schedLabel(d),
    d.tpl?'Tap to start '+d.tpl.name+'.':'Your schedule has you training today.','ironlog-sched');
}

/* ==========================================================================
   NAV + BOOT
   ========================================================================== */
function renderTab(){
  ({log:renderLog,templates:renderTemplates,history:renderHistory,progress:renderProgress,body:renderBody})[S.tab]();
}
function switchTab(t){
  S.tab=t;
  if(t==='history')histLimit=60;
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $$('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+t));
  $('#htitle').textContent={log:'IronLog',templates:'Templates',history:'History',progress:'Progress',body:'Body'}[t];
  const m=$('main');
  if(m)m.scrollTop=0;
  renderTab();
  // retrigger the staggered entrance. renderTab() replaces the page's children,
  // so the class has to go on AFTER the render, with a reflow to restart it.
  const pg=$('#page-'+t);
  if(pg){
    pg.classList.remove('anim');void pg.offsetWidth;pg.classList.add('anim');
    // v5.7: retire the class once the entrance has played. Left on, it stayed
    // armed for the life of the page, so anything that re-ran animations (an
    // iOS standalone resume) re-cascaded the whole tab.
    clearTimeout(pg._animT);
    pg._animT=setTimeout(()=>pg.classList.remove('anim'),700);
  }
  // keep the tab bar's accessible state in step with its visual state
  $$('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t?'true':'false'));
}
async function loadAll(){
  let exs=await allOf('exercises');
  if(!exs.length){                       // first run: seed the library
    for(const e of SEED)await dbPut('exercises',e);
    exs=SEED.slice();
  }
  S.ex=new Map(exs.map(e=>[e.id,e]));
  S.workouts=await allOf('workouts');
  S.templates=await allOf('templates');
  S.body=await allOf('body');
  S.photos=await allOf('photos');
  BW_CACHE=null;
}
// backfill for existing installs AND old imported backups: add new seed
// exercises (v3 granular lifts, v5 cardio) unless the user deleted them —
// tombstoned in kv 'deadSeeds' — and apply granular muscle tags to old seeds
// (skipped once the user has edited an exercise). This is how a v4 database
// or backup "degrades up" into v5: everything else is additive fields.
async function seedBackfill(){
  const deadSeeds=new Set((await kvGet('deadSeeds'))||[]);
  for(const e of SEED)if(!S.ex.has(e.id)&&!deadSeeds.has(e.id)){S.ex.set(e.id,e);await dbPut('exercises',e);}
  for(const[id,p]of Object.entries(SEED_PATCH)){
    const e=S.ex.get(id);
    if(e&&!e.edited&&e.m!==p.m){e.m=p.m;e.s=p.s;await dbPut('exercises',e);}
  }
  // per-side tagging for existing installs. Guarded by `edited` and by a
  // one-shot kv flag, so a user who deliberately sets a lift back to
  // "both sides" never has it flipped again on the next boot.
  if(!(await kvGet('uniPatched'))){
    for(const id of SEED_UNI){
      const e=S.ex.get(id);
      if(e&&!e.edited&&!e.uni){e.uni=1;await dbPut('exercises',e);}
    }
    await kvPut('uniPatched',1);
  }
}
async function boot(){
  // a reloaded page inherits whatever history state the last session left in
  // this entry, so start every run from a known sheet depth of zero
  try{history.replaceState({ilSheet:0},'');}catch(e){}
  await openDB();
  // ask to be exempt from browser storage eviction before anything else
  // touches the data — see ensurePersistence() for why this matters
  ensurePersistence();
  // marks an installed Android app so bottom controls get gesture-strip
  // clearance (see body.aphone). Set once: the display mode cannot change
  // within a WebAPK's lifetime, and a browser tab needs no floor.
  if(IS_ANDROID&&isStandalone())document.body.classList.add('aphone');
  await loadAll();
  await seedBackfill();
  S.set={...DEF,...((await kvGet('settings'))||{})};
  INTRO_DONE=(await kvGet('introDone'))||null;
  BK.last=(await kvGet('lastBackupAt'))||null;      // primes the backup nag
  BK.snooze=(await kvGet('backupSnooze'))||0;
  applyTheme();
  S.active=(await kvGet('active'))||null;
  if(S.active)for(const en of S.active.exs){       // restore caches for a resumed session
    S.prev[en.exId]=prevSetsFor(en.exId);
    S.records[en.exId]=computeRecords(en.exId);
  }
  $$('nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  $('#gearbtn').addEventListener('click',settingsSheet);
  $('#rt-minus').addEventListener('click',()=>adjustRest(-15));
  $('#rt-plus').addEventListener('click',()=>adjustRest(15));
  $('#rt-skip').addEventListener('click',skipRest);
  let tickN=0;
  setInterval(()=>{
    const el=$('#wo-dur');
    if(el&&S.active)el.textContent=fmtDur((Date.now()-S.active.startedAt)/1000);
    fixShell();   // heals a short standalone viewport within 1 s, event or not
    if(++tickN%60===0)schedTick();
  },1000);
  schedTick();
  // follow the system appearance live while 'auto' is selected
  try{matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{
    if(S.set.theme==='auto'){applyTheme();renderTab();}
  });}catch(e){}
  // header elevation: a deliberate edge once content is scrolled under it
  const mainEl=$('main');
  if(mainEl)mainEl.addEventListener('scroll',()=>{
    document.body.classList.toggle('scrolled',mainEl.scrollTop>4);
  },{passive:true});
  // reopening the app is the reliable moment to catch a reminder that came due
  // while it was closed — iOS freezes page JS in the background regardless
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'){schedTick();if(S.tab==='log'&&!S.active)renderLog();}
  });
  // …and hiding it is the last reliable moment to land a pending autosave
  const flushPending=()=>{if(saveT!=null)flushActive();};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushPending();});
  addEventListener('pagehide',flushPending);
  document.addEventListener('freeze',flushPending);
  // iOS keyboard healing: the keyboard pans the page to reveal the focused
  // input and can leave it panned after dismissal (header clipped under the
  // status bar, dead space under the nav). Centre focused inputs inside the
  // internal scroller so iOS barely needs to pan, and snap the window back
  // whenever focus leaves an input.
  document.addEventListener('focusin',e=>{
    if(e.target.matches&&e.target.matches('input,textarea'))
      setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'});}catch(err){}},300);
  });
  addEventListener('focusout',()=>setTimeout(()=>{
    const a=document.activeElement;
    if(!a||!(a.matches&&a.matches('input,textarea')))window.scrollTo(0,0);
  },60));
  function fixShell(){
    const plan=shellPlan({
      ios:IS_IOS,
      mode:(S.set&&S.set.shellFix)||'auto',
      standalone:isStandalone(),
      vvH:window.visualViewport?Math.round(visualViewport.height):0,
      screenW:screen.width,screenH:screen.height,
      portrait:matchMedia('(orientation: portrait)').matches,
      // the layout viewport — honest even while our own pin is applied
      curH:document.documentElement.clientHeight,
      curW:document.documentElement.clientWidth,
    });
    if(plan.height){
      document.documentElement.style.height=plan.height+'px';   // html clips at ICB otherwise
      document.body.style.height=plan.height+'px';
      document.body.classList.add('vfix');
    }else if(plan.release&&document.body.style.height){
      // the heal does not apply here (not iOS standalone, or switched off) —
      // hand the shell back to plain position:fixed. Guarded on style.height
      // so the once-a-second tick is a no-op in the overwhelming common case.
      document.documentElement.style.height='';
      document.body.style.height='';
      document.body.classList.remove('vfix');
    }
  }
  fixShell();
  if(window.visualViewport)visualViewport.addEventListener('resize',fixShell);
  addEventListener('pageshow',fixShell);
  // Android fires resize (not orientationchange) when the system bars or the
  // keyboard change the viewport, and the manifest's portrait lock means
  // orientationchange can never fire in a WebAPK at all — so the healer must
  // not depend on it for recovery.
  addEventListener('resize',fixShell);
  addEventListener('orientationchange',()=>{
    document.documentElement.style.height='';
    document.body.style.height='';
    document.body.classList.remove('vfix');
    setTimeout(fixShell,350);
  });
  // service worker: rest-over notifications + offline cache (needs secure context)
  if('serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});
  // returning to a throttled tab: sync the timer display immediately
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&RT.on)tickRest();});
  // debug/test handle (like window.__game in the neighbouring project)
  window.__il={S,buildExportData,applyImport,loadAll,renderTab,switchTab,muscleRecovery,strengthProfile,computeRecords,notifyRestDone,
    weeklyPRs,cardioRecommendation,tplTargetsFromWorkout,tplDiffers,seedBackfill,isCardio,
    // v5.2
    strengthProfile,strengthLoad,workLoad,strengthEligible,mechRatio,romFactor,isCalibrated,
    muscleAgg,workoutVolume,balanceEl,workoutCardioMin,setIntroDone:v=>{INTRO_DONE=v;},
    mechSummary,uncalibratedMachines,plotCalc,movementSheet,computeRecords,loadOf,epley,
    rigFigureSVG,poseJoints,ik2,exerciseLibrarySheet,
    schedFor,scheduleSheet,schedTick,daysBetween,dateKey,fatigueColor,muscleRecovery,
    checkPR,reverifySet,prevSetsFor,dbPut,kvGet,kvPut,allOf,launchIntent,applyLaunchIntent,
    // v5.7: cross-platform shell + storage durability
    shellPlan,fixShell,IS_IOS,IS_ANDROID,isStandalone,
    ensurePersistence,storageReport,STORE_ST,fmtBytes,
    backupNagDue,backupNagCard,backupDueDays,BK,noteBackup,canShareBackup,
    ghost,applyTheme,themeIsLight,SHEETS,
    exportJSON,importJSON,APP_VER,
    // atomic restore, live PR re-derivation, autosave flush, local dates
    recheckPRs,saveActive,flushActive,backupFileName,bestWeightGuess};
  switchTab('log');
  applyLaunchIntent();
}
/* The manifest has advertised two long-press shortcuts since v5 ("Start empty
   workout" → ?start=empty, "History" → ?tab=history) but nothing ever read the
   query string, so both silently dropped you on the Log tab. Android surfaces
   manifest shortcuts prominently on long-press, so on the S25 Ultra these are
   visible, tappable and — until now — broken. Parsed defensively: an unknown
   tab is ignored, and starting a workout never clobbers one already running. */
function launchIntent(search){
  let q;
  try{q=new URLSearchParams(search||'');}catch(e){return {};}
  const tab=q.get('tab'), start=q.get('start');
  const out={};
  if(tab&&['log','templates','history','progress','body'].includes(tab))out.tab=tab;
  if(start==='empty')out.startEmpty=true;
  return out;
}
function applyLaunchIntent(){
  const it=launchIntent(location.search);
  if(it.tab)switchTab(it.tab);
  if(it.startEmpty&&!S.active){switchTab('log');startEmpty();}
  // drop the query so a reload (or the SW serving from cache) doesn't re-fire
  if((it.tab||it.startEmpty)&&location.search){
    try{history.replaceState(history.state,'',location.pathname);}catch(e){}
  }
}
boot().catch(err=>{
  console.error(err);
  document.body.insertAdjacentHTML('beforeend',
    '<div style="padding:90px 24px;text-align:center;color:#ff5c5c;font-size:15px">IronLog failed to start: '+err.message+'<br><br>IndexedDB must be available (serve over http:// or https://).</div>');
});
</script>
