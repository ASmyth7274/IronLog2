/* ----- MOVEMENT PLOTTER -------------------------------------------------
   Draw the rig, drag two paths onto it, and the leverage ratio + range of
   motion fall out of the geometry (see the MECHANICS section for the physics).
   The figure doubles as the scale reference: it is drawn FIG_UNITS tall and
   represents your height, so handle travel converts straight to centimetres. */
const RIG_F=92;                       // floor line, rig units
/* Defaults are chosen so the plotted path starts within the figure's actual
   reach — an unreachable default would render the limb straining on open. */
const PLOT_DEF={
  // handle path (hands/feet) and weight path (the load), per machine style
  lever:{fx:30,pos:'seated', hx0:47,hy0:55,hx1:34,hy1:57, wx0:80,wy0:76,wx1:80,wy1:66},
  cable:{fx:30,pos:'seated', hx0:47,hy0:55,hx1:34,hy1:57, wx0:85,wy0:80,wx1:85,wy1:66},
  sled:{fx:26,pos:'lying',   hx0:44,hy0:64,hx1:58,hy1:50, wx0:50,wy0:70,wx1:64,wy1:56},
  direct:{fx:34,pos:'standing',hx0:44,hy0:60,hx1:44,hy1:44, wx0:44,wy0:60,wx1:44,wy1:44},
};
const PLOT_KEYS=['hx0','hy0','hx1','hy1','wx0','wy0','wx1','wy1'];

/* ---- rigged figure -------------------------------------------------------
   Drawn in the same low-poly, dark-outlined language as the Body page muscle
   map, so the two read as one app. Two differences: this one is POSABLE (a
   joint skeleton per body position rather than a fixed anatomical view), and
   it is lit by which muscles the exercise trains rather than by fatigue —
   reusing the fatigue ramp's hot end so the colours stay familiar.
   The working limb runs two-bone IK onto the start of the movement path, so
   the figure genuinely reaches for the handle as you drag it. */
const LEG_M=new Set(['Quads','Hamstrings','Glutes','Calves','Adductors','Abductors']);
// The torso is split front/back along the spine so a profile view can still
// tell Chest from Back — exactly the distinction that matters most here.
const SEG_MUSCLES={
  shoulder:['Shoulders','Front Delts','Side Delts','Rear Delts','Traps'],
  upperArm:['Biceps','Triceps'],
  forearm:['Forearms'],
  chest:['Chest'],
  back:['Back','Traps'],
  abs:['Abs','Obliques'],
  lowerBack:['Lower Back'],
  glute:['Glutes','Abductors'],
  thigh:['Quads','Hamstrings','Adductors'],
  shin:['Calves'],
};
// limb lengths in rig units, scaled from real segment proportions against a
// FIG_UNITS-tall figure (upper arm ~30 cm, forearm+hand ~32 cm, thigh/shin ~45 cm)
const BONE={upper:10.5,fore:10.5,thigh:16,shin:16};
function poseJoints(pos,fx){
  const F=RIG_F;
  if(pos==='standing')return{head:[fx+1,F-57],neck:[fx+1,F-51],sh:[fx+1,F-49],
    elb:[fx+5,F-40],wri:[fx+9,F-32],hip:[fx,F-31],knee:[fx-1,F-16],ank:[fx,F-2]};
  if(pos==='seated')return{head:[fx-4,F-46],neck:[fx-3,F-40],sh:[fx-2,F-38],
    elb:[fx+5,F-33],wri:[fx+12,F-30],hip:[fx,F-19],knee:[fx+16,F-18],ank:[fx+18,F-2]};
  if(pos==='lying')return{head:[fx-21,F-16],neck:[fx-15,F-16],sh:[fx-13,F-16],
    elb:[fx-13,F-25],wri:[fx-13,F-32],hip:[fx+3,F-15],knee:[fx+15,F-14],ank:[fx+18,F-2]};
  return{head:[fx-14,F-44],neck:[fx-10,F-39],sh:[fx-8,F-37],                 // incline
    elb:[fx-3,F-31],wri:[fx+3,F-27],hip:[fx+3,F-21],knee:[fx+15,F-18],ank:[fx+17,F-2]};
}
// two-bone IK; if the target is out of reach the limb straightens toward it
// rather than snapping, which is itself a useful "that plot is too far" cue
function ik2(root,target,l1,l2,flip){
  const dx=target[0]-root[0],dy=target[1]-root[1];
  const d=Math.hypot(dx,dy)||1e-3;
  const dc=Math.max(Math.abs(l1-l2)+.01,Math.min(d,(l1+l2)*.999));
  const ux=dx/d,uy=dy/d;
  const end=[root[0]+ux*dc,root[1]+uy*dc];
  const a=(l1*l1-l2*l2+dc*dc)/(2*dc);
  const hh=Math.sqrt(Math.max(0,l1*l1-a*a));
  const s=flip?-1:1;
  return[[root[0]+ux*a-s*uy*hh,root[1]+uy*a+s*ux*hh],end];
}
const ELBOW_FLIP={standing:false,seated:false,lying:true,incline:false};
const KNEE_FLIP={standing:true,seated:true,lying:true,incline:true};
function rigFigureSVG(pos,fx,ex,target,tracksLegs){
  const F=RIG_F,J=poseJoints(pos,fx);
  if(target){
    if(tracksLegs){const[k,a]=ik2(J.hip,target,BONE.thigh,BONE.shin,KNEE_FLIP[pos]);J.knee=k;J.ank=a;}
    else{const[e,w]=ik2(J.sh,target,BONE.upper,BONE.fore,ELBOW_FLIP[pos]);J.elb=e;J.wri=w;}
  }
  const light=document.body.classList.contains('light');
  const cold=light?'#DDD9CE':'#2E3646';   // lifted off --rigbg so untrained limbs still read
  const prim=(ex&&ex.m)||'',sec=(ex&&ex.s)||[];
  const heat=seg=>{
    const list=SEG_MUSCLES[seg]||[];
    if(list.includes(prim))return 2;
    return sec.some(m=>list.includes(m))?1:0;
  };
  // primary = the ramp's fully-fatigued red, secondary = its mid orange
  const fill=seg=>{const hv=heat(seg);return hv===2?fatigueColor(100):hv===1?fatigueColor(52):cold;};
  const mid=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  const pstr=ps=>ps.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const limb=(a,b,wa,wb)=>{
    const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;
    const nx=-dy/L,ny=dx/L;
    return pstr([[a[0]+nx*wa,a[1]+ny*wa],[b[0]+nx*wb,b[1]+ny*wb],
            [b[0]-nx*wb,b[1]-ny*wb],[a[0]-nx*wa,a[1]-ny*wa]]);
  };
  // one side of the centreline only; sign −1 is anterior (the figure always
  // faces the −normal of the neck→hip spine, in every pose)
  const half=(a,b,wa,wb,sign)=>{
    const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;
    const nx=-dy/L*sign,ny=dx/L*sign;
    return pstr([[a[0],a[1]],[b[0],b[1]],[b[0]+nx*wb,b[1]+ny*wb],[a[0]+nx*wa,a[1]+ny*wa]]);
  };
  const poly=(seg,pts)=>'<polygon points="'+pts+'" fill="'+fill(seg)+'"/>';
  const disc=(seg,c,r)=>'<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="'+r+'" fill="'+fill(seg)+'"/>';
  const grey=inner=>'<g fill="'+cold+'">'+inner+'</g>';
  const spineMid=mid(J.neck,J.hip,.52);
  let s='';
  // furniture first, so the body sits on top of the bench
  const bench=(x,y,w2,h2,rot)=>'<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w2+'" height="'+h2
    +'" rx="1.3" class="bench"'+(rot?' transform="rotate('+rot+' '+(x+w2/2).toFixed(1)+' '+(y+h2/2).toFixed(1)+')"':'')+'/>';
  if(pos==='seated')s+=bench(fx-8,F-17,24,2.6)+bench(fx-9.6,F-40,2.6,24);
  else if(pos==='lying')s+=bench(fx-24,F-11,38,2.8);
  else if(pos==='incline')s+=bench(fx-15,F-20,26,2.6)+bench(fx-14,F-40,2.6,21,-24);
  // body, drawn back-to-front
  // the limb doing the work ends in a gold marker, matching the path it drives
  // (resolved per theme rather than var(), which is unreliable in SVG attrs)
  const endFill=light?'#A9884D':'#C9A96D';
  s+=poly('thigh',limb(J.hip,J.knee,5,3.7))+poly('shin',limb(J.knee,J.ank,3.5,2.5));
  s+='<polygon points="'+limb(J.ank,[J.ank[0]+4,J.ank[1]+.5],2.5,2)+'" fill="'
    +(tracksLegs?endFill:cold)+'"/>';                                             // foot
  s+=disc('glute',J.hip,4.6);
  s+=poly('abs',half(spineMid,J.hip,5.2,4.6,-1))+poly('lowerBack',half(spineMid,J.hip,5.2,4.6,1))
    +poly('chest',half(J.neck,spineMid,4.6,5.6,-1))+poly('back',half(J.neck,spineMid,4.6,5.6,1));
  s+=grey('<polygon points="'+limb(J.neck,J.head,2.3,2.3)+'"/>');                  // neck
  s+=poly('upperArm',limb(J.sh,J.elb,3.1,2.5))+poly('forearm',limb(J.elb,J.wri,2.5,1.9));
  s+=disc('shoulder',J.sh,3.5);
  s+=grey('<circle cx="'+J.head[0].toFixed(1)+'" cy="'+J.head[1].toFixed(1)+'" r="4.2"/>');
  s+='<circle cx="'+J.wri[0].toFixed(1)+'" cy="'+J.wri[1].toFixed(1)+'" r="2.4" fill="'
    +(tracksLegs?cold:endFill)+'"/>';                                             // hand
  return '<g class="rigfig">'+s+'</g>';
}
// the whole model in one function: work in = work out, gravity acts vertically
function plotCalc(M){
  const hd=Math.hypot(M.hx1-M.hx0,M.hy1-M.hy0);
  const wv=Math.abs(M.wy1-M.wy0);
  const ratio=hd>1?Math.max(.05,Math.min(4,wv/hd)):1;
  return {hd,wv,ratio,romCm:hd*cmPerUnit()};
}
function movementSheet(ex,onSaved){
  const src=ex.mech||{};
  const base=PLOT_DEF[src.kind]||PLOT_DEF.lever;
  const M={kind:src.kind||(ex.e==='Cable'?'cable':'lever'),pos:src.pos||base.pos,fx:src.fx!=null?src.fx:base.fx};
  for(const k of PLOT_KEYS)M[k]=src[k]!=null?src[k]:base[k];
  let uni=!!ex.uni;
  // leg exercises push with the feet, so that is the limb that should track
  // the path — and the label should say FEET, not HANDS
  const legs=LEG_M.has(ex.m);

  // NB: h() uses createElement, which would make an HTML-namespace <svg> whose
  // children never become real SVG nodes. Parsing the markup gets the namespace
  // right; innerHTML on a genuine SVGElement then stays in the SVG namespace.
  const rigWrap=h('div',{html:'<svg class="rig" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>'});
  const svg=rigWrap.firstElementChild;
  const rRatio=h('div',{class:'v'}),rRom=h('div',{class:'v'}),rEff=h('div',{class:'v'});
  const expl=h('p',{class:'tiny dim',style:'margin:9px 2px 0;line-height:1.5'});
  // a real number from this exercise makes the preview concrete
  const rec=computeRecords(ex.id);
  const sample=rec&&rec.w?rec.w.v:(S.set.unit==='kg'?60:135);

  /* The figure PERFORMS the rep on a loop: the working limb rides the handle
     path while the plate rides the load path, so a wrong plot is obvious at a
     glance. Static geometry (paths, dots, labels) lives in draw(); the moving
     parts live in a <g class="dyn"> that frame() rewrites. The loop pauses
     while a finger owns a dot, and never starts under prefers-reduced-motion. */
  let dynG=null,raf=0,lastT=0;
  const animT0=performance.now();
  const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(t){
    if(!dynG)return;
    lastT=t;
    const lerp=(a,b)=>a+(b-a)*t;
    const tgt=[lerp(M.hx0,M.hx1),lerp(M.hy0,M.hy1)];
    const px=lerp(M.wx0,M.wx1),py=lerp(M.wy0,M.wy1);
    dynG.innerHTML=rigFigureSVG(M.pos,M.fx,ex,tgt,legs)
      +'<rect x="'+(px-5).toFixed(1)+'" y="'+(py-2.2).toFixed(1)+'" width="10" height="4.4" rx="1.2" class="plate"/>';
  }
  function loop(now){
    raf=requestAnimationFrame(loop);
    if(drag)return;                        // finger owns the geometry mid-drag
    const cyc=((now-animT0)/2400)%1;       // 2.4 s per rep, out and back
    const ping=cyc<.5?cyc*2:2-cyc*2;
    frame(.5-.5*Math.cos(ping*Math.PI));   // ease in-out at both turnarounds
  }
  function draw(){
    const c=plotCalc(M);
    const pt=(x,y,cls)=>'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.2" class="'+cls+'"/>';
    const arrow=(x1,y1,x2,y2,cls)=>'<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" class="'+cls+'"/>';
    let s='<line x1="2" y1="'+RIG_F+'" x2="98" y2="'+RIG_F+'" class="floor"/>';
    // the moving parts render into this layer, under the paths and dots
    s+='<g class="dyn"></g>';
    s+=arrow(M.wx0,M.wy0,M.wx1,M.wy1,'wpath')+arrow(M.hx0,M.hy0,M.hx1,M.hy1,'hpath');
    // the vertical component is the part that does work — show it explicitly
    if(Math.abs(M.wx1-M.wx0)>1.5)
      s+=arrow(M.wx0,M.wy0,M.wx0,M.wy1,'vhint');
    s+=pt(M.hx0,M.hy0,'hp')+pt(M.hx1,M.hy1,'hp')+pt(M.wx0,M.wy0,'wp')+pt(M.wx1,M.wy1,'wp');
    // labels ride above the middle of each path, clear of the figure
    const lbl=(x,y,cls,txt)=>'<text x="'+Math.max(9,Math.min(91,x)).toFixed(1)+'" y="'
      +Math.max(7,y).toFixed(1)+'" class="lbl '+cls+'" text-anchor="middle">'+txt+'</text>';
    const hlx=(M.hx0+M.hx1)/2,hly=Math.min(M.hy0,M.hy1)-4.5;
    let wlx=(M.wx0+M.wx1)/2,wly=Math.min(M.wy0,M.wy1)-4.5;
    // sled-style rigs run both paths in parallel, which stacks the two labels
    if(Math.abs(wlx-hlx)<17&&Math.abs(wly-hly)<8)wly=hly-7;
    s+=lbl(hlx,hly,'hpl',legs?'FEET':'HANDS')+lbl(wlx,wly,'wpl','LOAD');
    svg.innerHTML=s;
    // re-grab the layer (innerHTML replaced it) and paint one frame straight
    // away, so the figure is never missing between draws
    dynG=svg.querySelector('.dyn');
    frame(REDUCE||drag?0:lastT);
    const cm=cmPerUnit();
    rRatio.textContent='×'+c.ratio.toFixed(2);
    rRom.textContent=Math.round(c.romCm)+' cm';
    const eff=sample*c.ratio*(uni?2:1);
    rEff.textContent=fmtW(round1(eff));
    expl.textContent='Your '+(legs?'feet':'hands')+' travel '+Math.round(c.hd*cm)+' cm while the load rises '
      +Math.round(c.wv*cm)+' cm, so every '+fmtW(sample)+' '+S.set.unit+' on this machine loads you like '
      +fmtW(round1(sample*c.ratio))+' '+S.set.unit+' of free weight'
      +(uni?', doubled to '+fmtW(round1(eff))+' '+S.set.unit+' because you log one side at a time':'')+'.';
  }
  // Drag by proximity rather than per-circle listeners: the SVG is re-rendered
  // on every move, so element-bound handlers would be destroyed mid-gesture.
  let drag=null;
  const at=e=>{
    const r=svg.getBoundingClientRect();
    return{x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};
  };
  svg.addEventListener('pointerdown',e=>{
    const p=at(e);
    let bestK=null,bestD=9;   // ~30 px on a phone: a comfortable touch target
    for(const k of['h0','h1','w0','w1','fig']){
      const x=k==='fig'?M.fx:M[k[0]+'x'+k[1]],y=k==='fig'?RIG_F-30:M[k[0]+'y'+k[1]];
      const d=Math.hypot(p.x-x,p.y-y);
      if(d<bestD){bestD=d;bestK=k;}
    }
    if(!bestK)return;
    drag=bestK;
    try{svg.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  svg.addEventListener('pointermove',e=>{
    if(!drag)return;
    const p=at(e),cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
    if(drag==='fig')M.fx=cl(p.x,10,60);
    else{M[drag[0]+'x'+drag[1]]=cl(p.x,4,96);M[drag[0]+'y'+drag[1]]=cl(p.y,4,RIG_F);}
    draw();e.preventDefault();
  });
  const stop=()=>{drag=null;};
  svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);

  const styleSeg=seg(MECH_KINDS,M.kind,v=>{
    M.kind=v;
    const d=PLOT_DEF[v];
    M.pos=d.pos;M.fx=d.fx;
    for(const k of PLOT_KEYS)M[k]=d[k];
    posSeg.replaceWith(posSeg=seg(MECH_POS,M.pos,pv=>{M.pos=pv;draw();}));
    draw();
  });
  let posSeg=seg(MECH_POS,M.pos,v=>{M.pos=v;draw();});
  const uniSeg=seg([['bi','Total load'],['uni','Per side']],uni?'uni':'bi',v=>{uni=v==='uni';draw();});

  const readout=h('div',{class:'mech-read'},
    h('div',{},rRatio,h('div',{class:'k'},'Leverage')),
    h('div',{},rRom,h('div',{class:'k'},'Range')),
    h('div',{},rEff,h('div',{class:'k'},'≈ free wt')));

  const body=h('div',{},
    h('p',{class:'small dim',style:'margin:2px 2px 10px;line-height:1.5'},
      'Drag the gold dots to trace where your '+(legs?'feet':'hands')+' travel — the figure reaches for them — and the purple dots to trace how far the load moves. IronLog works out the real load on your muscles from the geometry. Muscles this exercise trains are lit in red.'),
    h('span',{class:'lbl'},'Machine style'),styleSeg,
    h('span',{class:'lbl'},'Body position'),posSeg,
    h('div',{style:'margin-top:12px'},rigWrap),
    readout,expl,
    h('span',{class:'lbl'},'How you log it'),uniSeg,
    h('p',{class:'tiny dim',style:'margin:6px 2px 0;line-height:1.5'},
      'Pick “per side” when the number you type is what ONE arm or leg moves — a pair of dumbbells (30 kg means 30 in each hand) or a single-arm/single-leg lift. IronLog doubles it for your strength score only.'),
    h('button',{class:'btn primary mt12',onclick:async()=>{
      const c=plotCalc(M);
      ex.mech={kind:M.kind,pos:M.pos,fx:Math.round(M.fx*10)/10,
        ratio:Math.round(c.ratio*1000)/1000,romCm:Math.round(c.romCm),at:Date.now()};
      for(const k of PLOT_KEYS)ex.mech[k]=Math.round(M[k]*10)/10;
      if(uni)ex.uni=1;else delete ex.uni;
      ex.edited=1;
      await dbPut('exercises',ex);
      close();
      toast('Calibrated — '+ex.name+' now counts toward your strength score');
      if(onSaved)onSaved();
    }},'Save calibration'),
    ex.mech?h('button',{class:'btn danger mt8',onclick:async()=>{
      delete ex.mech;
      await dbPut('exercises',ex);
      close();toast('Calibration removed');
      if(onSaved)onSaved();
    }},'Remove calibration'):null,
    h('p',{class:'tiny dim',style:'margin:10px 2px 0;line-height:1.5'},
      'Scale comes from your height ('+(S.set.heightCm||DEF.heightCm)+' cm — change it in Settings). Calibration only affects the strength score; your logged weights, volume and PRs stay exactly as typed.'));

  // onClose cancels the rAF loop — without it the sheet would keep animating
  // (and re-rendering the figure) forever after being dismissed
  const close=sheet('Movement · '+ex.name,body,{onClose:()=>{if(raf)cancelAnimationFrame(raf);raf=0;}});
  draw();
  if(!REDUCE)raf=requestAnimationFrame(loop);
}

async function deleteExerciseFlow(ex,closeEdit,onChanged){
  const usedW=S.workouts.filter(w=>w.exs.some(en=>en.exId===ex.id)).length;
  const usedT=S.templates.filter(t=>t.exs.some(te=>te.exId===ex.id)).length;
  const usedA=!!(S.active&&S.active.exs.some(en=>en.exId===ex.id));
  const finish=async()=>{
    if(SEED.some(s2=>s2.id===ex.id)){          // tombstone so boot doesn't re-seed it
      const dead=(await kvGet('deadSeeds'))||[];
      if(!dead.includes(ex.id)){dead.push(ex.id);await kvPut('deadSeeds',dead);}
    }
    await dbDel('exercises',ex.id);
    S.ex.delete(ex.id);
    delete S.prev[ex.id];delete S.records[ex.id];
    if(closeEdit)closeEdit();
    if(onChanged)onChanged();else renderTab();
  };
  if(!usedW&&!usedT&&!usedA){
    if(await ask('Delete '+ex.name+'?','It was never logged — this only removes it from the library.','Delete',true)){
      await finish();
      toast('Exercise deleted');
    }
    return;
  }
  const where=[usedW?usedW+' workout'+(usedW>1?'s':''):null,
    usedT?usedT+' template'+(usedT>1?'s':''):null,
    usedA?'the current workout':null].filter(Boolean).join(', ');
  const ok=await ask('Delete '+ex.name+'?',
    'It appears in '+where+'. Pick a replacement exercise and every logged set (weight, reps, RPE) moves to it — nothing is lost.',
    'Choose replacement',true);
  if(!ok)return;
  pickExercises({multi:false,allowCreate:false,editable:false,exclude:ex.id,title:'Move history to…',onDone:async ids=>{
    await remapExercise(ex.id,ids[0]);
    await finish();
    const nx=S.ex.get(ids[0]);
    toast('History moved to '+(nx?nx.name:'replacement'));
  }});
}
// rewires every reference from oldId → newId; duplicate entries in the same
// workout are merged (sets appended) so nothing renders twice
async function remapExercise(oldId,newId){
  const remapEntries=list=>{
    const out=[];
    for(const en of list){
      const id=en.exId===oldId?newId:en.exId;
      const tgt=id===newId?out.find(e=>e.exId===newId):null;
      if(tgt&&tgt.sets&&en.sets){
        tgt.sets.push(...en.sets);
        if(en.notes&&!tgt.notes)tgt.notes=en.notes;
      }else if(tgt){
        /* template targets: keep the first entry */
      }else{
        en.exId=id;out.push(en);
      }
    }
    return out;
  };
  for(const w of S.workouts){
    if(!w.exs.some(en=>en.exId===oldId))continue;
    w.exs=remapEntries(w.exs);
    await dbPut('workouts',w);
  }
  for(const t of S.templates){
    if(!t.exs.some(te=>te.exId===oldId))continue;
    t.exs=remapEntries(t.exs);
    await dbPut('templates',t);
  }
  if(S.active&&S.active.exs.some(en=>en.exId===oldId)){
    S.active.exs=remapEntries(S.active.exs);
    S.prev[newId]=prevSetsFor(newId);
    recheckPRs(newId);
    saveActive();
  }
}

/* Backup nag. A browser can clear a "best-effort" origin at any time, and an
   exported file is the only copy that survives that — so once there is real
   history to lose, ask for one. Read from cached kv (BK.last / BK.snooze,

const BK={last:null,snooze:0};
const NAG_AFTER_D=21, NAG_SNOOZE_D=7, NAG_MIN_WORKOUTS=5;
function backupDueDays(now){
  if(BK.last==null)return Infinity;
  return Math.floor((now-BK.last)/86400000);

function backupNagDue(env){
  if(env.workouts<NAG_MIN_WORKOUTS)return false;
  if(env.snooze&&(env.now-env.snooze)<NAG_SNOOZE_D*86400000)return false;
  if(env.last==null)return true;
  return (env.now-env.last)>=NAG_AFTER_D*86400000;
}
function backupNagCard(){

// PREV reference for a row: the matching set from the previous session of this
// exercise, falling back to the template target. This is the priority feature.
// Rows are matched by KIND and position within that kind — working set 2 reads
// last session's working set 2, warm-up 1 reads last session's warm-up 1 —
// never by raw array index. Index matching broke whenever the two sessions'
// warm-ups differed: start from a template (which builds working rows only)
// after a session that had warm-ups and working set 1 showed last week's first
// warm-up, so ticking it untouched logged the warm-up's numbers as a working
// set; the warm-up calculator, which inserts rows at the top, shifted every
// row the other way. A missing row counts as a working set.
function ghost(en,j){
  const p=S.prev[en.exId];
  const isW=s=>!!(s&&s.t==='W');
  const warm=isW(en.sets[j]);
  let k=0;   // this row's position among the rows of its own kind
  for(let i=0;i<=j;i++)if(isW(en.sets[i])===warm)k++;
  const pack=(ps,src)=>({t:ps.t,w:ps.w,r:ps.r,rpe:ps.rpe,dur:ps.dur!=null?ps.dur:null,
    dist:ps.dist!=null?ps.dist:null,src});
  const same=p?p.sets.filter(s=>isW(s)===warm):[];
  if(same[k-1])return pack(same[k-1],'prev');
  // a warm-up never borrows a working set's numbers — nor the template's
  // working target — and a ramp's extra rung has no meaningful stand-in
  if(warm)return null;
  // v5.7: adding a set beyond last session's count used to blank PREV entirely
  // — and adding a set is the common case, so the headline feature went missing
  // exactly when it was most useful. Fall back to last session's FINAL working
  // set, which is what you actually want a reference for on set 4. Flagged
  // src:'prevlast' so prevTxt can mark it as carried over rather than matched.
  if(same.length)return pack(same[same.length-1],'prevlast');
  if(en.tgt&&(en.tgt.w!=null||en.tgt.r!=null||en.tgt.dur!=null||en.tgt.dist!=null))
    return{t:'N',w:en.tgt.w!=null?en.tgt.w:null,r:en.tgt.r!=null?en.tgt.r:null,rpe:en.tgt.rpe!=null?en.tgt.rpe:null,
      dur:en.tgt.dur!=null?en.tgt.dur:null,dist:en.tgt.dist!=null?en.tgt.dist:null,src:'tgt'};
  return null;
}
function prevTxt(g){
  if(!g)return '—';
  const tag=g.t&&g.t!=='N'?g.t+' ':'';
  if(g.dur!=null||g.dist!=null){
    const parts=[];
    if(g.dur!=null)parts.push(fmtW(g.dur)+'m');
    if(g.dist!=null)parts.push(fmtW(g.dist)+distUnit());
    return tag+parts.join('·');
  }
  if(g.w!=null&&g.r!=null)return tag+fmtW(g.w)+'×'+g.r;
  if(g.r!=null)return tag+g.r+' reps';
  if(g.w!=null)return tag+fmtW(g.w);
  return '—';
}
function setNumber(en,j){let n=0;for(let k=0;k<=j;k++)if(en.sets[k].t!=='W')n++;return n;}
function setRow(i,j){
  const en=S.active.exs[i],st=en.sets[j];

    st.t==='N'?String(setNumber(en,j)):st.t);

  let in1,in2;
  if(cd){
    in1=h('input',{class:'set-in num',type:'text',inputmode:'decimal',
      value:st.dur!=null?fmtW(st.dur):'',placeholder:g&&g.dur!=null?fmtW(g.dur):'−',
      oninput:e=>{st.dur=pf(e.target.value);saveActive();updateWoStats();reverifySet(en,st,row);}});
    in2=h('input',{class:'set-in num',type:'text',inputmode:'decimal',
      value:st.dist!=null?fmtW(st.dist):'',placeholder:g&&g.dist!=null?fmtW(g.dist):'−',
      oninput:e=>{st.dist=pf(e.target.value);saveActive();reverifySet(en,st,row);}});
  }else{
    in1=h('input',{class:'set-in num',type:'text',inputmode:'decimal',
      value:st.w!=null?fmtW(st.w):'',placeholder:g&&g.w!=null?fmtW(g.w):'−',
      oninput:e=>{st.w=pf(e.target.value);saveActive();updateWoStats();reverifySet(en,st,row);}});
    in2=h('input',{class:'set-in num',type:'text',inputmode:'numeric',
      value:st.r!=null?st.r:'',placeholder:g&&g.r!=null?String(g.r):'−',
      oninput:e=>{const v=pf(e.target.value);st.r=v==null?null:Math.round(v);saveActive();updateWoStats();reverifySet(en,st,row);}});
  }
  const pIn=h('input',{class:'set-in num',type:'text',inputmode:'decimal',
    value:st.rpe!=null?st.rpe:'',placeholder:g&&g.rpe!=null?String(g.rpe):'−',
    oninput:e=>{st.rpe=pf(e.target.value);saveActive();}});
  /* v5.7: Enter walks the row — weight -> reps -> tick the set. Logging a set
     was three taps plus two keyboard dismissals; now the keyboard never has to
     be put away mid-set. enterkeyhint labels the Android/iOS return key to
     match ("next" then "done"). */
  const stepOn=(from,to)=>from.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    e.preventDefault();
    if(to)to.focus();
    else{from.blur();chk.click();}
  });
  const prevBtn=h('button',{class:'prev-cell num',
    title:g&&g.src==='tgt'?'Template target — tap to fill'
      :g&&g.src==='prevlast'?'Last set of your previous session — tap to fill'
      :'Previous session — tap to fill',
    'aria-label':'Previous: '+prevTxt(g)+' — tap to fill',
    onclick:()=>{
      if(!g)return;
      if(cd){
        if(g.dur!=null){st.dur=g.dur;in1.value=fmtW(g.dur);}
        if(g.dist!=null){st.dist=g.dist;in2.value=fmtW(g.dist);}
      }else{
        if(g.w!=null){st.w=g.w;in1.value=fmtW(g.w);}
        if(g.r!=null){st.r=g.r;in2.value=g.r;}
      }
      saveActive();updateWoStats();
    }},prevTxt(g));
  const chk=h('button',{class:'chk','aria-label':'Mark set done',onclick:()=>toggleDone(i,j,row,in1,in2),
    html:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'});
  in1.setAttribute('enterkeyhint','next');
  in2.setAttribute('enterkeyhint','done');
  in1.setAttribute('aria-label',cd?'Minutes':'Weight');
  in2.setAttribute('aria-label',cd?'Distance':'Reps');
  pIn.setAttribute('aria-label','RPE');
  stepOn(in1,in2);
  stepOn(in2,null);
  row.append(typeBtn,prevBtn,in1,in2,pIn,chk);
  return row;
}
function toggleDone(i,j,row,in1,in2){
  const en=S.active.exs[i],st=en.sets[j];

  if(!st.done){

    const g=ghost(en,j);
    if(cd){
      if(st.dur==null&&g&&g.dur!=null){st.dur=g.dur;in1.value=fmtW(g.dur);}
      if(st.dist==null&&g&&g.dist!=null){st.dist=g.dist;in2.value=fmtW(g.dist);}
    }else{
      if(st.w==null&&g&&g.w!=null){st.w=g.w;in1.value=fmtW(g.w);}

}

/* ----- PR detection (live, while logging) ----- */
// milestone "club" lifts: first time the bar hits 60/80/100/120… kg
// (135/180/225… lb) on an exercise. Uses typed bar weight — plates, not BW.
function milestoneFor(w,prevBest){
  const step=S.set.unit==='kg'?20:45,start=S.set.unit==='kg'?60:135;
  if(w<start)return null;
  const m=Math.floor((w-start)/step)*step+start;   // highest milestone reached
  if(prevBest!=null&&prevBest>=m)return null;      // already a member
  return m;
}
// Records what has already been celebrated for a given set object, so an edit
// that merely nudges RPE on an already-cheered PR stays quiet while an edit
// that creates a NEW record still gets the full treatment. WeakMap (not a
// field on the set) keeps this out of IndexedDB and out of backups.
const PR_SAID=new WeakMap();
const prKey=r=>r?r.msgs.join('|')+(r.club!=null?'|club'+r.club:''):'';
function announcePR(res,st){
  if(!res||(!res.msgs.length&&res.club==null))return;
  const ex=res.ex;
  if(res.msgs.length){
    const emo=['🚀','🎉','🔥','💥','⚡','🏆'][Math.floor(Math.random()*6)];
    toast(emo+' '+(ex?ex.name:'')+' — '+res.msgs.join(', '),{pr:true,dur:4500});
    celebrate();
  }
  if(res.club!=null){
    toast('💯 '+fmtW(res.club)+' '+S.set.unit+' CLUB — '+(ex?ex.name:'')+'!',{pr:true,dur:5500});
    celebrateBig();
  }
  PR_SAID.set(st,prKey(res));
}
function checkPR(exId,st,row,quiet){
  if(st.t==='W')return null;
  const ex=S.ex.get(exId);
  if(isCardio(ex))return checkCardioPR(ex,st,row,quiet);
  if(!st.r)return null;
  const isBW=!!(ex&&ex.e==='Bodyweight');
  const rec=S.records[exId]||(S.records[exId]={e1rm:null,w:null,vol:null,fresh:true});
  const prevBestW=rec.w?rec.w.v:null;
  const w=loadOf(ex,st),e=w>0?epley(w,st.r):0;
  const msgs=[];
  if(w>0&&(!rec.w||w>rec.w.v+1e-9)){if(!rec.fresh)msgs.push('weight PR '+fmtW(w)+' '+S.set.unit+(isBW?' incl. BW':''));rec.w={v:w,date:Date.now()};}
  if(e>0&&(!rec.e1rm||e>rec.e1rm.v+1e-9)){if(!rec.fresh)msgs.push('est. 1RM PR '+fmtW(round1(e))+' '+S.set.unit);rec.e1rm={v:e,date:Date.now()};}
  let club=null;
  if(!isBW&&st.w)club=milestoneFor(st.w,prevBestW);
  if(msgs.length||club!=null){
    st.pr=1;
    if(row)row.classList.add('prset');
  }
  const res={msgs,club,ex};
  if(!quiet)announcePR(res,st);
  return res;
}
// cardio PRs: furthest distance, longest single session, best pace (needs a
// meaningful distance so a 100 m sprint doesn't own the pace record forever)
function checkCardioPR(ex,st,row,quiet){
  const rec=S.records[ex.id]||(S.records[ex.id]={cardio:true,dur:null,dist:null,pace:null,fresh:true});
  const msgs=[];
  if(st.dist>0&&(!rec.dist||st.dist>rec.dist.v+1e-9)){
    if(!rec.fresh)msgs.push('distance PR '+fmtW(st.dist)+' '+distUnit());
    rec.dist={v:st.dist,date:Date.now()};
  }
  if(st.dur>0&&(!rec.dur||st.dur>rec.dur.v+1e-9)){
    if(!rec.fresh)msgs.push('longest ever — '+fmtMin(st.dur));
    rec.dur={v:st.dur,date:Date.now()};
  }
  if(st.dur>0&&st.dist>=.5){
    const p=st.dur/st.dist;
    if(!rec.pace||p<rec.pace.v-1e-9){
      if(!rec.fresh&&rec.pace)msgs.push('pace PR '+fmtPace(p)+' /'+distUnit());
      rec.pace={v:p,date:Date.now()};
    }
  }
  if(msgs.length){
    st.pr=1;
    if(row)row.classList.add('prset');
  }
  const res={msgs,club:null,ex};
  if(!quiet)announcePR(res,st);
  return res;
}
/* Live PR flags, re-derived from scratch for one exercise: finished history
   first, then this session's done sets in row order — the order they get
   ticked in. Editing, unticking, deleting or re-typing one set can change
   which OTHER sets are records (lower set 1 and set 2 may become one), so
   every flag is recomputed rather than one patched. The old per-set check
   rebuilt records from finished history ONLY, forgetting a heavier set logged
   minutes earlier: merely retyping the reps on a lighter set re-crowned it
   with a false "weight PR", and an unticked record kept its gold ring (and
   was saved as a PR even after being edited below your best). Quiet by
   design — announcing stays the caller's decision. Returns the check result
   for `target`, painting it on `targetRow` when given. */
const ROW_OF=new WeakMap();   // set object → its rendered row, for repainting flags
function recheckPRs(exId,target,targetRow){
  S.records[exId]=computeRecords(exId);
  let out=null;
  if(!S.active)return out;
  for(const en of S.active.exs){
    if(en.exId!==exId)continue;
    for(const st of en.sets){
      const row=st===target&&targetRow?targetRow:ROW_OF.get(st)||null;
      st.pr=0;
      if(row)row.classList.remove('prset');
      if(!st.done)continue;
      const res=checkPR(exId,st,row,true);
      if(st===target)out=res;
    }
  }
  return out;
}
// editing a set AFTER ticking it saves immediately (inputs write straight to
// state + autosave); this re-checks the PR flags so a lowered weight doesn't
// keep a stale gold ring, without re-firing toasts/confetti
let PR_EDIT_T=null;
function reverifySet(en,st,row){
  if(!st.done)return;
  const res=recheckPRs(en.exId,st,row);   // silent pass: the gold ring tracks every keystroke
  saveActive();
  // …but an edit that turns a set INTO a record deserves the same celebration
  // as ticking one does. Debounced so typing 1 → 10 → 100 fires once, when you
  // stop, and keyed on the message so re-touching an already-cheered set (or
  // correcting a typo back to the same numbers) stays quiet.
  clearTimeout(PR_EDIT_T);
  const key=prKey(res);
  if(!key||PR_SAID.get(st)===key)return;
  PR_EDIT_T=setTimeout(()=>{if(st.done&&st.pr)announcePR(res,st);},850);
}

function bestWeightGuess(en){
  for(let j=en.sets.length-1;j>=0;j--)if(en.sets[j].w)return en.sets[j].w;
  // PREV of the first WORKING row: a warm-up's weight is no guess at what you
  // are working up to (it made the warm-up calculator ramp towards 40 kg)
  const jw=en.sets.findIndex(s=>s.t!=='W');
  const g=ghost(en,jw<0?en.sets.length:jw);
  if(g&&g.w)return g.w;
  const r=S.records[en.exId];
  return r&&r.w?r.w.v:null;
}

function plateSheet(defW,ex){
  const res=h('div',{class:'mt12'});
  const inp=h('input',{class:'in num',inputmode:'decimal',
    value:defW?fmtW(defW):'',placeholder:'Target weight ('+S.set.unit+')',oninput:calc});
  // per-exercise starting weight: plate-loaded machines start anywhere from
  // 0 to 20+ — saved on the exercise so each machine remembers its own
  const baseIn=h('input',{class:'in num',inputmode:'decimal',
    value:fmtW(ex&&ex.baseW!=null?ex.baseW:S.set.barWeight),
    oninput:async e=>{
      const v=pf(e.target.value);
      if(ex){
        if(v==null)delete ex.baseW;else ex.baseW=v;
        await dbPut('exercises',ex);
      }
      calc();
    }});
  const baseVal=()=>{const v=pf(baseIn.value);return v==null?S.set.barWeight:v;};
  function calc(){
    const w=pf(inp.value);
    res.replaceChildren();
    if(w==null)return;
    const bar=baseVal();
    if(w<bar){res.append(h('p',{class:'small dim'},'Below bar weight ('+fmtW(bar)+' '+S.set.unit+')'));return;}
    let per=(w-bar)/2;
    const out=[];
    for(const p of[...S.set.plates].sort((a,b)=>b-a)){
      let n=0;
      while(per>=p-1e-9){per-=p;n++;}
      if(n)out.push({v:p,n});
    }
    // side-on loaded bar, competition plate colours
    const maxP=Math.max(...S.set.plates);
    const viz=h('div',{class:'plates-viz'},h('div',{class:'bar-line'}));
    for(const {v,n} of out)for(let k=0;k<n;k++){
      const hgt=Math.round(44+(v/maxP)*66);
      const wd=v>=maxP*.6?15:v>=maxP*.2?12:9;
      viz.append(h('div',{class:'pwrap'},
        h('div',{class:'plate',style:'width:'+wd+'px;height:'+hgt+'px;background:'+plateColor(v)}),
        h('div',{class:'plbl num'},fmtW(v))));
    }
    viz.append(h('div',{class:'bar-collar'}));
    res.append(viz,
      h('p',{class:'bold num',style:'font-size:17px;text-align:center;margin-top:6px'},
        out.length?'Per side:  '+out.map(o=>fmtW(o.v)+'×'+o.n).join('   '):'Empty bar'));
    if(per>0.01)res.append(h('p',{class:'small',style:'color:var(--amb);margin-top:8px;text-align:center'},fmtW(round1(per*2))+' '+S.set.unit+' can’t be made with your plates'));
  }
  sheet('Plate calculator',h('div',{},
    h('span',{class:'lbl'},'Target weight ('+S.set.unit+')'),inp,
    h('span',{class:'lbl'},'Bar / machine start weight'),baseIn,
    h('p',{class:'tiny dim',style:'margin:5px 2px 0'},
      (ex?'Saved for '+ex.name+' — use 0 for machines that start empty.':'Global bar weight — open from an exercise’s menu to save per-machine.')
      +'  Plates: '+S.set.plates.join('/')),
    res));
  calc();
}
function warmupSheet(i){
  const en=S.active.exs[i];
  const res=h('div',{class:'mt12'});
  let scheme=[];
  const guess=bestWeightGuess(en);
  const inc=S.set.unit==='kg'?2.5:5;
  const inp=h('input',{class:'in num',inputmode:'decimal',
    value:guess?fmtW(guess):'',placeholder:'Working weight ('+S.set.unit+')',oninput:calc});
  function calc(){
    const w=pf(inp.value);
    res.replaceChildren();scheme=[];
    if(!w||w<=0)return;
    const bar=S.set.barWeight;
    if(w>bar)scheme.push({w:bar,r:10,pct:'bar'});
    for(const[pct,r]of[[.4,8],[.6,5],[.8,3],[.9,1]]){
      const wt=Math.round(w*pct/inc)*inc;
      if(wt>bar&&wt<w&&!scheme.some(s2=>s2.w===wt))scheme.push({w:wt,r,pct:Math.round(pct*100)+'%'});
    }
    if(!scheme.length){res.append(h('p',{class:'small dim'},'Weight too light for a ramp.'));return;}
    res.append(...scheme.map(s2=>h('div',{class:'lrow'},
      h('div',{class:'grow bold num',style:'font-size:17px'},fmtW(s2.w)+' '+S.set.unit+'  ×  '+s2.r),
      h('div',{class:'tiny dim'},s2.pct))));
  }
  const close=sheet('Warm-up calculator',h('div',{},inp,res,
    h('button',{class:'btn primary mt12',onclick:()=>{
      if(!scheme.length)return;
      en.sets.unshift(...scheme.map(s2=>({t:'W',w:s2.w,r:s2.r,rpe:null,done:false})));
      saveActive();close();replaceCard(i);toast('Warm-up sets added');
    }},'Add as warm-up sets')));
  calc();
}
// swap an exercise mid-workout (machine taken, gym busy) — candidates ranked
// by primary/secondary muscle overlap; granular groups match their parent too
function substituteSheet(i){
  const en=S.active.exs[i],ex=S.ex.get(en.exId);
  if(!ex)return;
  const nm=m=>REGION[m]||m;
  // same kind only: logged minutes/distance don't map onto weight×reps
  const cands=[...S.ex.values()].filter(x=>x.id!==ex.id&&isCardio(x)===isCardio(ex)).map(x=>{
    let sc=0;
    if(x.m===ex.m)sc+=4;else if(nm(x.m)===nm(ex.m))sc+=3;
    if((ex.s||[]).some(s2=>nm(s2)===nm(x.m)))sc+=2;
    if((x.s||[]).some(s2=>nm(s2)===nm(ex.m)))sc+=2;
    sc+=(x.s||[]).filter(s2=>(ex.s||[]).map(nm).includes(nm(s2))).length*.5;
    if(x.e===ex.e)sc+=.5;
    return{x,sc};
  }).filter(o=>o.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,20);
  const rows=cands.map(({x})=>{
    const p=prevSetsFor(x.id);
    return h('div',{class:'ex-row',onclick:()=>{
      const oldId=en.exId;
      en.exId=x.id;
      if(!(x.id in S.prev))S.prev[x.id]=prevSetsFor(x.id);
      // gold rings earned against the old lift mean nothing on the new one
      recheckPRs(x.id);recheckPRs(oldId);
      saveActive();close();replaceCard(i);
      toast('Swapped to '+x.name);
    }},
    h('div',{class:'grow'},
      h('div',{class:'bold',style:'font-size:15.5px'},x.name),
      h('div',{class:'tiny dim'},x.m+(x.s&&x.s.length?', '+x.s.join(', '):'')+' · '+x.e+(p?'  ·  last '+fmtDateShort(p.date):''))));
  });
  const close=sheet('Substitute · '+ex.name,h('div',{},
    h('p',{class:'tiny dim',style:'margin:0 2px 8px'},'Closest matches by trained muscles — sets you’ve already logged keep their values.'),
    rows.length?rows:h('p',{class:'small dim',style:'padding:10px 2px'},'No similar exercises found.')));
}

async function discardFlow(){
  if(await ask('Discard workout?','All sets logged in this session will be lost.','Discard',true)){
    S.active=null;S.prev={};S.records={};
    skipRest();saveActive();renderLog();
  }
}

/* ----- finish & save ----- */
async function finishWorkout(){
  const a=S.active;
  if(!a)return;
  let done=0,pending=0,vol=0,prs=0,cd=0;
  for(const en of a.exs){
    const ex=S.ex.get(en.exId);
    for(const st of en.sets){
      if(st.done){done++;if(st.t!=='W')vol+=workLoad(ex,st)*(st.r||0);if(st.pr)prs++;if(st.dur)cd+=st.dur;}
      else if(st.w!=null||st.r!=null||st.dur!=null||st.dist!=null)pending++;
    }
  }
  if(!done){
    if(await ask('Nothing logged','No completed sets — discard this workout?','Discard',true)){
      S.active=null;S.prev={};S.records={};saveActive();renderLog();
    }
    return;
  }
  const dur=Math.round((Date.now()-a.startedAt)/1000);
  const nameIn=h('input',{class:'in',value:a.name});
  const noteIn=h('textarea',{class:'in',placeholder:'How did it go?'},a.notes||'');
  const close=sheet('Finish workout',h('div',{},
    h('div',{class:'statgrid'},
      h('div',{},h('div',{class:'v num'},fmtDur(dur)),h('div',{class:'k'},'Duration')),
      h('div',{},h('div',{class:'v num'},done),h('div',{class:'k'},'Sets')),
      h('div',{},
        vol||!cd?h('div',{class:'v num'},fmtVol(vol)+' '+S.set.unit):h('div',{class:'v num'},Math.round(cd)+' min'),
        h('div',{class:'k'},vol||!cd?'Volume':'Cardio')),
      h('div',{},h('div',{class:'v num'},prs?'🏆 '+prs:'—'),h('div',{class:'k'},'PRs'))),
    pending?h('p',{class:'small',style:'color:var(--amb);margin:0 2px 10px'},pending+' incomplete set'+(pending>1?'s':'')+' will be discarded.'):null,
    h('span',{class:'lbl'},'Name'),nameIn,
    h('span',{class:'lbl'},'Notes'),noteIn,
    h('button',{class:'btn green mt12',onclick:save},'Save Workout')));
  // the save awaits the database before the sheet closes, so a double tap
  // used to run it twice: the session appeared in History twice (volume and
  // records counted double until the next launch) under two stacked
  // "Save as template?" prompts
  let saving=false;
  async function save(){
    if(saving)return;saving=true;
    const exs=a.exs.map(en=>({exId:en.exId,notes:en.notes||'',
      sets:en.sets.filter(s2=>s2.done).map(s2=>{
        const o={t:s2.t,w:s2.w,r:s2.r,rpe:s2.rpe};
        if(s2.dur!=null)o.dur=s2.dur;
        if(s2.dist!=null)o.dist=s2.dist;
        if(s2.pr)o.pr=1;
        return o;
      })})).filter(en=>en.sets.length);
    const volPRs=[];
    for(const en of exs){
      const x=S.ex.get(en.exId);
      const sv=en.sets.reduce((t2,s2)=>t2+(s2.t!=='W'?workLoad(x,s2)*(s2.r||0):0),0);
      const rec=S.records[en.exId];
      if(rec&&!rec.fresh&&rec.vol&&sv>rec.vol.v&&x)volPRs.push(x.name);
    }
    const w={id:a.id,name:nameIn.value.trim()||a.name,notes:noteIn.value.trim(),
      startedAt:a.startedAt,finishedAt:Date.now(),dur,exs};
    try{await dbPut('workouts',w);}
    catch(err){saving=false;toast('Couldn’t save — '+err.message,{dur:5000});return;}
    S.workouts.push(w);
    const tplId=a.tplId;
    S.active=null;S.prev={};S.records={};
    skipRest();await flushActive();
    close();renderLog();
    toast('Workout saved 💪'+(volPRs.length?' · session volume PR: '+volPRs.join(', '):''),{dur:3500});
    // started from a template and changed its structure → offer to sync the
    // template; otherwise (ad-hoc workout) offer to save it as a new one
    const t0=tplId?S.templates.find(x=>x.id===tplId):null;
    if(t0&&tplDiffers(t0,w))offerTplUpdate(t0,w);
    else if(!tplId)offerTemplate(w);
  }
}
/* one exercise entry of a workout → template targets: work-set count plus the
   top set's numbers (duration/distance for cardio, weight/reps/RPE otherwise) */
function tplTargetsFromWorkout(w){
  return w.exs.map(en=>{
    const x=S.ex.get(en.exId);
    const work=en.sets.filter(s2=>s2.t!=='W');
    if(isCardio(x)){
      const top=work.reduce((b2,s2)=>((s2.dur||0)>((b2&&b2.dur)||0)?s2:b2),null)||en.sets[0]||{};
      return{exId:en.exId,sets:work.length||en.sets.length||1,
        dur:top&&top.dur!=null?top.dur:null,dist:top&&top.dist!=null?top.dist:null};
    }
    const top=work.reduce((b2,s2)=>((s2.w||0)>((b2&&b2.w)||0)?s2:b2),null)||en.sets[0]||{};
    return{exId:en.exId,sets:work.length||en.sets.length||1,
      reps:(top&&top.r)||null,w:(top&&top.w)||null,rpe:(top&&top.rpe)||null};
  });
}
// structural diff: exercise sequence or work-set counts changed
function tplDiffers(t,w){
  const a=t.exs.map(te=>te.exId+':'+(te.sets||0)).join('|');
  const b=w.exs.map(en=>en.exId+':'+en.sets.filter(s2=>s2.t!=='W').length).join('|');
  return a!==b;
}
function offerTplUpdate(t,w){
  const close=sheet('Update “'+t.name+'”?',h('div',{},
    h('p',{class:'small dim',style:'margin:2px 2px 14px'},
      'This workout’s exercises or set counts differ from the template it started from. Save the changes back so next time starts from today’s version?'),
    h('button',{class:'btn primary',onclick:async()=>{
      t.exs=tplTargetsFromWorkout(w);
      await dbPut('templates',t);
      close();toast('Template “'+t.name+'” updated');
    }},'Save Changes to Template'),
    h('button',{class:'btn mt8',onclick:()=>close()},'Keep Template As Is')));
}
async function saveActiveToTemplate(){
  const a=S.active;
  const t=a&&a.tplId?S.templates.find(x=>x.id===a.tplId):null;
  if(!t)return;
  t.exs=tplTargetsFromWorkout(a);
  await dbPut('templates',t);
  toast('Template “'+t.name+'” updated');
}
function offerTemplate(w){
  let busy=false;   // one tap, one template — even a double one
  const close=sheet('Save as template?',h('div',{},
    h('p',{class:'small dim',style:'margin:2px 2px 14px'},'Reuse this workout’s exercises and targets from the Templates tab.'),
    h('button',{class:'btn primary',onclick:async()=>{
      if(busy)return;busy=true;
      const t={id:uid(),name:w.name,pos:Math.max(0,...S.templates.map(x=>x.pos||0))+1,
        exs:tplTargetsFromWorkout(w)};
      S.templates.push(t);
      await dbPut('templates',t);
      close();renderTab();toast('Template saved');
    }},'Save as Template'),
    h('button',{class:'btn mt8',onclick:()=>close()},'Not now')));
}

/* ==========================================================================
   REST TIMER — global; keeps counting on any tab
   ========================================================================== */
const RT={on:false,endsAt:0,total:0,int:null,label:'',alarm:null};
function startRest(sec,label){
  if(!sec||sec<=0)return;
  RT.on=true;RT.endsAt=Date.now()+sec*1000;RT.total=sec;RT.label=label||'';
  const p=$('#restpill');
  p.classList.remove('donefx');p.classList.add('show');
  if(!RT.int)RT.int=setInterval(tickRest,200);
  // one-shot alarm so completion still fires on time when a hidden tab
  // throttles the 200 ms interval
  clearTimeout(RT.alarm);
  RT.alarm=setTimeout(tickRest,sec*1000+80);
  tickRest();
}
function tickRest(){
  if(!RT.on)return;
  const rem=(RT.endsAt-Date.now())/1000;
  if(rem<=0){
    RT.on=false;
    $('#rt-fill').style.width='100%';
    restDone();
    return;
  }
  $('#rt-time').textContent=fmtClock(Math.ceil(rem));
  $('#rt-fill').style.width=Math.min(100,Math.max(0,(1-rem/RT.total)*100))+'%';
}
function restDone(){
  beep();
  notifyRestDone(RT.label);
  haptic([250,120,250]);
  const p=$('#restpill');
  p.classList.add('donefx');
  $('#rt-time').textContent='Go!';
  setTimeout(()=>{if(!RT.on)p.classList.remove('show','donefx');},2400);
}
function adjustRest(d){
  if(!RT.on)return;
  RT.endsAt=Math.max(Date.now()+500,RT.endsAt+d*1000);
  RT.total=Math.max(RT.total,(RT.endsAt-Date.now())/1000);
  clearTimeout(RT.alarm);
  RT.alarm=setTimeout(tickRest,Math.max(100,RT.endsAt-Date.now()+80));
  tickRest();
}
function skipRest(){
  RT.on=false;
  clearTimeout(RT.alarm);
  $('#restpill').classList.remove('show','donefx');
}
/* completion beep — WebAudio (context unlocked on first touch) */
let AC=null;
function audioCtx(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
  return AC;
}
document.addEventListener('pointerdown',audioCtx,{once:true,capture:true});
function beep(){
  if(!S.set.sound)return;
  const c=audioCtx();
  if(!c)return;
  const t0=c.currentTime;
  [[0,880],[.22,880],[.44,1318.5]].forEach(([d,f])=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t0+d);
    g.gain.exponentialRampToValueAtTime(.5,t0+d+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t0+d+.18);
    o.connect(g);g.connect(c.destination);
    o.start(t0+d);o.stop(t0+d+.22);
  });
}
/* ----- rest-over notification (Notification API via service worker where
   available). Requires a secure context (HTTPS or localhost); on iPhone it
   additionally requires the app installed to the Home Screen (iOS 16.4+).
   Over plain http we say so in Settings and fall back to sound/vibration. ----- */
function notifSupport(){
  if(!('Notification' in window))return{ok:false,why:'Notifications aren’t supported in this browser.'};
  if(!window.isSecureContext)return{ok:false,why:'Needs HTTPS or localhost — not available over plain http.'};
  return{ok:true,why:''};
}
let NICON=null;
function notifIcon(){
  // the app now ships real PWA icons — use one instead of the canvas emoji
  // (kept below as a fallback for any context where the file can't resolve)
  if(location.protocol.startsWith('http'))return new URL('icon-192.png',location.href).href;
  if(NICON)return NICON;
  try{
    const c=document.createElement('canvas');c.width=c.height=96;
    const x=c.getContext('2d');
    x.fillStyle='#4c8dff';x.beginPath();x.arc(48,48,46,0,7);x.fill();
    x.font='54px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🏋️',48,53);
    NICON=c.toDataURL();
  }catch(e){}
  return NICON;
}
// shared delivery path: service-worker notification where available (required
// on iOS), plain Notification elsewhere. Callers own the permission checks.
async function pushNotif(title,body,tag){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{
    let reg=null;
    if('serviceWorker' in navigator)reg=await navigator.serviceWorker.getRegistration();
    if(reg&&reg.showNotification){
      await reg.showNotification(title,{body,tag,renotify:true,vibrate:[250,120,250],icon:notifIcon(),badge:notifIcon()});
    }else{
      const n=new Notification(title,{body,tag,icon:notifIcon()});
      n.onclick=()=>{try{window.focus();n.close();}catch(e){}};
    }
  }catch(e){}
}
async function notifyRestDone(label,force){
  if(!S.set.notify&&!force)return;
  if(!force&&document.visibilityState==='visible')return;   // pill + beep cover the foreground
  await pushNotif('Rest over — go! ⏱️',
    label?'Next set: '+label:'Time for your next set.','ironlog-rest');
}

function renderTemplates(){
  const pg=$('#page-templates');pg.replaceChildren();
  pg.append(h('button',{class:'btn primary',style:'margin-bottom:12px',onclick:()=>tplEditor(null)},'+ New Template'));
  const tpls=[...S.templates].sort((a,b)=>(a.pos||0)-(b.pos||0));
  if(!tpls.length){
    pg.append(h('div',{class:'empty'},h('div',{class:'big'},'📋'),
      h('p',{},'A template is a reusable workout plan — an ordered list of exercises with target sets × reps. Create one here, or finish a workout and save it as a template.')));
    return;
  }
  for(const t of tpls){
    pg.append(h('section',{class:'card'},
      h('div',{class:'row'},
        h('div',{class:'grow bold',style:'font-size:16px'},t.name),
        h('button',{class:'btn sm inline primary',onclick:()=>startFromTemplate(t)},'Start'),
        h('button',{class:'icon-btn',style:'width:40px;height:40px',onclick:()=>tplMenu(t)},
          h('span',{style:'font-size:22px;letter-spacing:1px;color:var(--dim)'},'···'))),
      h('div',{class:'mt8'},t.exs.map(te=>{
        const x=S.ex.get(te.exId);
        if(isCardio(x))return h('div',{class:'hist-line'},
          h('b',{},(te.sets||1)+' × '),
          x.name+(te.dur!=null?' — '+fmtMin(te.dur):'')+(te.dist!=null?' · '+fmtW(te.dist)+' '+distUnit():''));
        // no rep target yet → "3 sets", not the broken-looking "3 × ?"
        return h('div',{class:'hist-line'},
          h('b',{},te.reps!=null?(te.sets||1)+' × '+te.reps+'  ':(te.sets||1)+' set'+((te.sets||1)>1?'s':'')+'  '),
          (x?x.name:'?')+(te.w!=null?' — '+fmtW(te.w)+' '+S.set.unit:'')+(te.rpe!=null?' @ '+te.rpe:''));
      }))));
  }
}
function tplMenu(t){
  const mk=(label,fn,cls)=>h('button',{class:'btn mt8'+(cls?' '+cls:''),onclick:()=>{close();fn();}},label);
  const close=sheet(t.name,h('div',{},
    mk('Edit',()=>tplEditor(t)),
    mk('Duplicate',async()=>{
      const c=JSON.parse(JSON.stringify(t));
      c.id=uid();c.name=t.name+' (copy)';c.pos=Math.max(0,...S.templates.map(x=>x.pos||0))+1;
      S.templates.push(c);await dbPut('templates',c);renderTemplates();
    }),
    mk('Move up',()=>moveTpl(t,-1)),
    mk('Move down',()=>moveTpl(t,1)),
    mk('Delete',async()=>{
      if(await ask('Delete '+t.name+'?','This template will be removed. Past workouts are not affected.','Delete',true)){
        await dbDel('templates',t.id);
        S.templates=S.templates.filter(x=>x.id!==t.id);
        renderTemplates();
      }
    },'danger')));
}
async function moveTpl(t,dir){
  const tpls=[...S.templates].sort((a,b)=>(a.pos||0)-(b.pos||0));
  tpls.forEach((x,i)=>x.pos=i);
  const i=tpls.indexOf(t),j=i+dir;
  if(j<0||j>=tpls.length)return;
  [tpls[i].pos,tpls[j].pos]=[tpls[j].pos,tpls[i].pos];
  for(const x of tpls)await dbPut('templates',x);
  renderTemplates();
}
function tplEditor(orig){
  const tp=orig?JSON.parse(JSON.stringify(orig))
    :{id:uid(),name:'',pos:Math.max(0,...S.templates.map(x=>x.pos||0))+1,exs:[]};
  const nameIn=h('input',{class:'in',placeholder:'e.g. Push Day A',value:tp.name});
  const list=h('div');
  function refresh(){
    if(!tp.exs.length){
      list.replaceChildren(h('p',{class:'small dim',style:'padding:14px 2px'},'No exercises yet — add some below.'));
      return;
    }
    list.replaceChildren(...tp.exs.map((te,i)=>{
      const x=S.ex.get(te.exId);
      const cd=isCardio(x);
      const f=(key,label,intOnly)=>h('div',{style:'flex:1'},
        h('div',{class:'tiny dim',style:'text-align:center;margin-bottom:3px'},label),
        h('input',{class:'set-in num',style:'height:42px',type:'text',inputmode:'decimal',
          value:te[key]!=null?te[key]:'',placeholder:'−',
          oninput:e=>{const v=pf(e.target.value);te[key]=v==null?null:(intOnly?Math.round(v):v);}}));
      return h('div',{style:'border-bottom:1px solid var(--line);padding:10px 0'},
        h('div',{class:'row'},
          h('div',{class:'grow bold'},x?x.name:'?'),
          h('button',{class:'icon-btn',style:'width:38px;height:38px',onclick:()=>rowMenu(i)},
            h('span',{style:'font-size:20px;color:var(--dim)'},'···'))),
        h('div',{class:'row mt8'},
          cd?[f('sets','Intervals',true),f('dur','Min'),f('dist',distUnit())]
            :[f('sets','Sets',true),f('reps','Reps',true),f('w',S.set.unit),f('rpe','RPE')]));
    }));
  }
  function rowMenu(i){
    const mk=(label,fn,cls)=>h('button',{class:'btn mt8'+(cls?' '+cls:''),onclick:()=>{cl2();fn();refresh();}},label);
    const cl2=sheet('Exercise',h('div',{},
      i>0?mk('Move up',()=>{[tp.exs[i-1],tp.exs[i]]=[tp.exs[i],tp.exs[i-1]];}):null,
      i<tp.exs.length-1?mk('Move down',()=>{[tp.exs[i+1],tp.exs[i]]=[tp.exs[i],tp.exs[i+1]];}):null,
      mk('Remove',()=>{tp.exs.splice(i,1);},'danger')));
  }
  const close=sheet(orig?'Edit template':'New template',h('div',{},
    h('span',{class:'lbl'},'Name'),nameIn,
    h('span',{class:'lbl'},'Exercises'),list,
    h('button',{class:'btn mt12',onclick:()=>pickExercises({onDone:ids=>{
      ids.forEach(id=>{
        const x=S.ex.get(id);
        tp.exs.push(isCardio(x)?{exId:id,sets:1,dur:20,dist:null}:{exId:id,sets:3,reps:8,w:null,rpe:null});
      });
      refresh();
    }})},'+ Add Exercises'),
    h('button',{class:'btn primary mt8',onclick:async()=>{
      tp.name=nameIn.value.trim()||'Template';
      if(!tp.exs.length){toast('Add at least one exercise');return;}
      await dbPut('templates',tp);
      const idx=S.templates.findIndex(x=>x.id===tp.id);
      if(idx>=0)S.templates[idx]=tp;else S.templates.push(tp);
      close();renderTemplates();toast('Template saved');
    }},'Save Template')));
  refresh();
}

   ========================================================================== */
let histLimit=60;   // paginate so years of history stay fast to render
function renderHistory(){
  const pg=$('#page-history');pg.replaceChildren();
  const ws=workoutsDesc();
  if(!ws.length){
    pg.append(h('div',{class:'empty'},h('div',{class:'big'},'📅'),
      h('p',{},'Finished workouts appear here with duration, volume and every set — tap one to review, repeat or delete it.')));
    return;
  }
  const shown=ws.slice(0,histLimit);
  let lastMonth='';
  for(const w of shown){
    const mo=new Date(w.finishedAt).toLocaleDateString(undefined,{month:'long',year:'numeric'});
    if(mo!==lastMonth){pg.append(h('span',{class:'lbl'},mo));lastMonth=mo;}
    const prCount=w.exs.reduce((n,en)=>n+en.sets.filter(s2=>s2.pr).length,0);
    pg.append(h('section',{class:'card',onclick:()=>workoutSheet(w)},
      h('div',{class:'row'},
        h('div',{class:'grow'},
          h('div',{class:'bold',style:'font-size:15.5px'},w.name),
          h('div',{class:'tiny dim'},fmtDate(w.finishedAt)+' · '+fmtTime(w.finishedAt))),
        prCount?h('div',{style:'color:var(--gold);font-weight:700;font-size:13px'},'🏆 '+prCount):null),
      h('div',{class:'wo-stats',style:'margin:7px 0 9px'},
        h('span',{},h('b',{class:'num'},fmtDur(w.dur)),''),
        // cardio-only sessions have no tonnage — show minutes, not "0 kg"
        (v=>v>0?h('span',{},h('b',{class:'num'},fmtVol(v)),' '+S.set.unit)
          :(cm=>cm>0?h('span',{},h('b',{class:'num'},Math.round(cm)),' min cardio'):null)(workoutCardioMin(w)))(workoutVolume(w)),
        h('span',{},h('b',{class:'num'},workoutSets(w)),' sets')),
      w.exs.slice(0,4).map(en=>{
        const x=S.ex.get(en.exId);
        return h('div',{class:'hist-line'},h('b',{},en.sets.length+' × '),(x?x.name:'?')+topLine(en,x));
      }),
      w.exs.length>4?h('div',{class:'hist-line dim'},'+'+(w.exs.length-4)+' more'):null));
  }
  if(ws.length>shown.length)pg.append(h('button',{class:'btn mt8',
    onclick:()=>{histLimit+=120;renderHistory();}},
    'Show older workouts ('+(ws.length-shown.length)+' more)'));
}
function topLine(en,x){
  if(isCardio(x||S.ex.get(en.exId))){
    let du=0,di=0;
    for(const st of en.sets){if(st.t==='W')continue;du+=st.dur||0;di+=st.dist||0;}
    if(!du&&!di)return'';
    return ' — '+(du?fmtMin(du):'')+(du&&di?' · ':'')+(di?fmtW(round1(di))+' '+distUnit():'');
  }
  let top=null;
  for(const st of en.sets)if(st.t!=='W'&&st.w&&(!top||st.w>top.w))top=st;
  return top?' — '+fmtW(top.w)+'×'+(top.r!=null?top.r:'?'):'';
}
function setLine(st){
  const rpe=st.rpe!=null?'  @ '+st.rpe:'';
  if(st.dur!=null||st.dist!=null){
    const parts=[];
    if(st.dur!=null)parts.push(fmtMin(st.dur));
    if(st.dist!=null)parts.push(fmtW(st.dist)+' '+distUnit());
    return parts.join(' · ')+rpe;
  }
  if(st.w!=null&&st.r!=null)return fmtW(st.w)+' × '+st.r+rpe;
  if(st.r!=null)return st.r+' reps'+rpe;
  if(st.w!=null)return fmtW(st.w)+' '+S.set.unit+rpe;
  return '—';
}
function workoutSheet(w){
  const c=h('div');
  const wv=workoutVolume(w),wcm=workoutCardioMin(w);
  c.append(h('p',{class:'small dim',style:'margin:0 2px 6px'},
    fmtDate(w.finishedAt)+' · '+fmtTime(w.finishedAt)+' · '+fmtDur(w.dur)
    +(wv>0?' · '+fmtVol(wv)+' '+S.set.unit:wcm>0?' · '+Math.round(wcm)+' min cardio':'')));
  if(w.notes)c.append(h('div',{class:'note-pill'},w.notes));
  for(const en of w.exs){
    const x=S.ex.get(en.exId);

// per-session series for one exercise: est. 1RM, top-set weight, total volume
function exSeries(exId,days){
  const cut=days?Date.now()-days*864e5:0;
  const ex=S.ex.get(exId);
  const cd=isCardio(ex);
  const pts=[];
  for(const w of[...S.workouts].sort((a,b)=>a.finishedAt-b.finishedAt)){
    if(w.finishedAt<cut)continue;
    const en=w.exs.find(x=>x.exId===exId);
    if(!en)continue;
    if(cd){   // per-session totals: minutes, distance, average pace
      let du=0,di=0;
      for(const st of en.sets){if(st.t==='W')continue;du+=st.dur||0;di+=st.dist||0;}
      if(du||di)pts.push({x:w.finishedAt,dur:round1(du),dist:round1(di),pace:du&&di?round1(du/di):0});
      continue;
    }
    let e1=0,top=0,vol=0;
    for(const st of en.sets){
      if(st.t==='W')continue;
      const wt=loadOf(ex,st),r=st.r||0;
      vol+=workLoad(ex,st)*r;   // tonnage domain; top set and e1RM stay as typed
      if(wt>top)top=wt;
      const e=epley(wt,r);
      if(e>e1)e1=e;
    }
    if(e1||top||vol)pts.push({x:w.finishedAt,e1rm:round1(e1),top,vol:Math.round(vol)});
  }
  return pts;
}
// weighted set/volume totals per muscle group (primary 1×, secondary 0.5×)
function muscleAgg(days,mode){
  const cut=Date.now()-days*864e5;
  const agg={};
  for(const w of S.workouts){
    if(w.finishedAt<cut)continue;
    for(const en of w.exs){
      const ex=S.ex.get(en.exId);
      if(!ex||isCardio(ex))continue;   // balance/volume stay strength-only; cardio feeds recovery instead
      for(const st of en.sets){
        if(st.t==='W')continue;
        // sets mode counts stimulus (a per-side lift still gives each side one
        // set); volume mode is tonnage, so it counts both sides and leverage
        const v=mode==='sets'?1:workLoad(ex,st)*(st.r||0);
        agg[ex.m]=(agg[ex.m]||0)+v;
        for(const s2 of ex.s||[])agg[s2]=(agg[s2]||0)+v*.5;
      }
    }
  }
  return agg;
}

function drawMuscleChart(cv,entries){

  if(CH.mus)CH.mus.destroy();

    data:{labels:entries.map(e2=>e2[0]),

/* Strength balance = per-muscle STRENGTH scores, not training volume. The
   scores are already normalised against bodyweight-scaled standards, which is
   what makes muscles comparable with each other at all — a short bar here is
   a muscle that is genuinely weaker than the rest of you, not one you merely
   trained less this month (the 7-day volume card above covers that). */
function balanceEl(){
  const sp=strengthProfile();
  const rows=RADAR_MUSCLES.map(m=>[m,sp.radar[m]||0]).sort((a,b)=>b[1]-a[1]);
  const withData=rows.filter(r=>r[1]>0);
  if(!withData.length)return h('p',{class:'small dim',style:'padding:8px 2px'},
    'Log free-weight or bodyweight lifts — or calibrate a machine — and each muscle’s relative strength shows here.');
  const max=withData[0][1];
  // MEDIAN, not mean: one outlier lift (a big deadlift lifting "Back") would
  // otherwise drag the reference up and paint every other muscle as lagging
  const sorted=withData.map(r=>r[1]).sort((a,b)=>a-b);
  const mid=Math.floor(sorted.length/2);
  const ref=sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
  const wrap=h('div');
  const zero=[];
  for(const[m,v]of rows){
    if(!v){zero.push(m);continue;}
    const rel=v/ref;   // the balance signal: how this muscle sits vs the rest of you
    const col=rel<.62?'var(--red)':rel<.8?'var(--amb)':'';
    wrap.append(h('div',{class:'bal-row'},
      h('div',{class:'nm'},m),
      h('div',{class:'bal-track'},h('div',{class:'bal-fill',
        style:'width:'+Math.round(v/max*100)+'%;'+(col?'background:'+col:'')})),
      h('div',{class:'pct num',style:col?'color:'+col:''},String(Math.round(v)))));
  }
  const lag=withData.filter(r=>r[1]/ref<.8).map(r=>r[0]);
  wrap.append(h('p',{class:'tiny dim',style:'margin:8px 2px 0;line-height:1.5'},
    lag.length
      ? '⚖️ Behind the rest of you: '+lag.join(', ')+' — each is more than 20 % below your median of '+Math.round(ref)+'.'
      : '⚖️ Well balanced — every muscle sits within 20 % of your median of '+Math.round(ref)+'.'));
  if(zero.length)wrap.append(h('p',{class:'tiny dim',style:'margin:6px 2px 0;line-height:1.5'},
    'No strength data yet: '+zero.join(', ')+' — these are only trained by machines or cables here, so calibrate one to bring them in.'));
  return wrap;
}

// downscale + JPEG-encode so years of photos stay small (and HEIC becomes viewable)
async function shrinkImage(file){
  try{
    const bmp=await createImageBitmap(file);
    const max=1280,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
    return blob||file;
  }catch(e){return file;}
}

        close();renderBody();

/* v5.7: 'auto' follows the system. Android surfaces a system dark-mode switch
   (often on a schedule), and a home-screen app that ignores it reads as foreign
   — the phone goes light at sunrise and the app stays black. Backwards
   compatible: DEF.theme stays 'dark' and every saved settings object keeps its
   explicit 'dark'/'light', so nobody's appearance changes until they opt in. */
const prefersLight=()=>matchMedia('(prefers-color-scheme: light)').matches;
function themeIsLight(){
  return S.set.theme==='light'||(S.set.theme==='auto'&&prefersLight());
}
function applyTheme(){
  const light=themeIsLight();
  document.body.classList.toggle('light',light);
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content',light?'#ECEAE3':'#0B0B0D');
  chartInit=false;   // charts re-read theme colours on next draw
}
// time-of-day + rotating greeting; name is optional and simply omitted
function greetLine(){
  const n=(S.set.name||'').trim();
  const hh=new Date().getHours();
  const tod=hh<5?'Still up':hh<12?'Good morning':hh<17?'Good afternoon':'Good evening';
  const opts=[[tod,'.'],['Hello','.'],['Ready to exercise','?'],['Time to move','.'],['Let’s get to work','.'],['Welcome back','.']];
  const pick=opts[Math.floor(Date.now()/864e5)%opts.length];
  return {base:pick[0],punct:pick[1],name:n};
}
/* Vibration honesty: iOS WebKit has never shipped navigator.vibrate, which is
   why the phone never buzzed. Fallback: programmatically toggling a native
   switch control fires a real system haptic on iOS 18+ — best-effort, and a
   silent no-op anywhere it isn't supported. Sound stays the reliable alert. */
let hapticEl=null;
function haptic(pattern){
  if(!S.set.vibrate)return;
  if(navigator.vibrate){try{navigator.vibrate(pattern);}catch(e){}return;}
  try{
    if(!hapticEl){
      hapticEl=document.createElement('input');
      hapticEl.type='checkbox';
      hapticEl.setAttribute('switch','');
      hapticEl.style.cssText='position:fixed;left:-99px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';
      document.body.append(hapticEl);
    }
    const taps=Array.isArray(pattern)?Math.min(4,Math.ceil(pattern.length/2)):1;
    for(let i=0;i<taps;i++)setTimeout(()=>hapticEl.click(),i*120);
  }catch(e){}
}

/* ==========================================================================
   MUSCLE RECOVERY — fatigue = Σ (hard sets × RPE-intensity × time decay)
   ========================================================================== */
function muscleRecovery(){
  const now=Date.now(),res={};
  for(const m of MUSCLES)res[m]={fatigue:0,last:null};
  const slot=m=>res[m]||(res[m]={fatigue:0,last:null});   // tolerate 'Other'/legacy tags
  for(const w of S.workouts){
    const ageH=(now-w.finishedAt)/36e5;
    for(const en of w.exs){
      const ex=S.ex.get(en.exId);
      if(!ex)continue;
      const pm=slot(ex.m);
      if(!pm.last||w.finishedAt>pm.last)pm.last=w.finishedAt;
      for(const s2 of ex.s||[]){const r2=slot(s2);if(!r2.last||w.finishedAt>r2.last)r2.last=w.finishedAt;}
      if(ageH>120)continue;                     // >5 days ago: fully recovered
      let sets=0,rpeSum=0,rpeN=0,mins=0;
      for(const st of en.sets){
        if(st.t==='W')continue;
        sets++;
        mins+=st.dur||(st.dist>0?st.dist*6:0);   // distance-only logs: ~6 min per km/mi
        if(st.rpe){rpeSum+=st.rpe;rpeN++;}
      }
      let add;
      if(isCardio(ex)){
        // cardio stress scales with duration: 10 min ≈ one hard set, capped
        // at ~80 min so an ultra doesn't peg the whole map for a week
        const intensity=rpeN?Math.min(1,rpeSum/rpeN/10):.6;   // steady cardio default: easier than lifting
        add=Math.min(8,mins/10)*intensity*Math.exp(-ageH/40)*9;
      }else{
        const intensity=rpeN?Math.min(1,rpeSum/rpeN/10):.75;   // RPE 10 = max stress
        add=sets*intensity*Math.exp(-ageH/40)*9;               // ~40 h decay constant
      }
      pm.fatigue+=add;
      for(const s2 of ex.s||[])slot(s2).fatigue+=add*.5;
    }
  }
  for(const m of Object.keys(res))res[m].fatigue=Math.min(100,Math.round(res[m].fatigue));
  return res;
}
/* Fatigue ramp. A straight hue sweep spends far too long in the greens — 50%
   landed on a pale yellow-green that read as "fine" when it is half-cooked.
   These stops front-load the warm end: amber by 35, deep orange at 50, red-
   orange by 70, saturating and darkening as it goes. */
const FAT_STOPS=[[0,142,58,40],[20,86,60,40],[35,48,78,45],[50,28,88,46],
  [70,12,84,44],[85,4,76,41],[100,0,72,37]];
function fatigueColor(f){
  f=Math.max(0,Math.min(100,f||0));
  let a=FAT_STOPS[0],b=FAT_STOPS[FAT_STOPS.length-1];
  for(let i=0;i<FAT_STOPS.length-1;i++){
    if(f>=FAT_STOPS[i][0]&&f<=FAT_STOPS[i+1][0]){a=FAT_STOPS[i];b=FAT_STOPS[i+1];break;}
  }
  const t=b[0]===a[0]?0:(f-a[0])/(b[0]-a[0]);
  const mix=(i)=>a[i]+(b[i]-a[i])*t;
  return 'hsl('+mix(1).toFixed(1)+' '+mix(2).toFixed(1)+'% '+mix(3).toFixed(1)+'%)';
}
const fatLabel=f=>f>=67?'Fatigued':f>=30?'Recovering':'Fresh';
function recChip(f){
  const c=fatigueColor(f);   // chip now tracks the same ramp as the body map
  return h('span',{class:'rec-chip',style:'color:'+c+';background:'+c.replace('hsl(','hsla(').replace(')',' / .16)')},fatLabel(f));
}
function agoTxt(ts){
  const d=Math.floor((Date.now()-ts)/864e5);
  return d<=0?'today':d===1?'1d ago':d+'d ago';

// max-fold a set of muscle stats (used to light a drawn region from
// granular groups, e.g. delts → the shoulder shape)
function foldMax(rec,names){
  let f=0,last=null,trained=false;
  for(const n of names){
    const r=rec[n];
    if(!r||r.last==null)continue;
    trained=true;
    if(r.fatigue>f)f=r.fatigue;
    if(!last||r.last>last)last=r.last;
  }
  return trained?{fatigue:f,last}:{fatigue:0,last:null};
}

/* ==========================================================================
   CARDIO COACH — pick the cardio modality that loads the freshest muscles
   ========================================================================== */
function cardioRecommendation(){
  const rec=muscleRecovery();
  const off=S.set.coachOff||[];
  const cands=[...S.ex.values()].filter(isCardio).filter(x=>!off.includes(x.id));
  if(!cands.length)return null;
  const fat=m=>(rec[m]||{fatigue:0}).fatigue;
  const scored=cands.map(x=>{
    let load=fat(x.m),wsum=1;
    for(const s2 of x.s||[]){load+=fat(s2)*.5;wsum+=.5;}
    return{x,sc:load/wsum};   // weighted avg fatigue of the muscles it works
  }).sort((a,b)=>a.sc-b.sc||a.x.name.localeCompare(b.x.name));
  // near-ties rotate daily so the suggestion doesn't rut
  const pool=scored.filter(o=>o.sc<=scored[0].sc+5);
  const pick=pool[Math.floor(Date.now()/864e5)%pool.length];
  const hot=MUSCLES.map(m=>[m,rec[m]]).filter(e2=>e2[1].last!=null)
    .sort((a,b)=>b[1].fatigue-a[1].fatigue)[0];
  return{ex:pick.x,sc:Math.round(pick.sc),
    hot:hot&&hot[1].fatigue>=30?{m:hot[0],f:hot[1].fatigue}:null};
}
function cardioReason(r){
  if(!r.hot)return 'Everything’s recovered — any modality works today.';
  const plural=!['Chest','Back','Lower Back'].includes(r.hot.m);
  if(r.sc<30)return 'Your '+r.hot.m.toLowerCase()+(plural?' are':' is')
    +(r.hot.f>=67?' fried':' still recovering')+' — this keeps the work off '+(plural?'them':'it')+'.';
  return 'Most of you has been working hard lately — this is the gentlest option right now.';
}

/* ==========================================================================
   WEEKLY PR BOARD — retro-computed records for the current week (Mon–Sun),
   so it also works on data logged before this feature existed.
   ========================================================================== */
function weeklyPRs(){
  const d0=new Date();d0.setHours(0,0,0,0);
  const wkStart=d0.getTime()-((d0.getDay()+6)%7)*864e5;   // Monday 00:00 local
  const out=[];
  const best={};   // exId → running all-time bests BEFORE the entry being scanned
  for(const w of[...S.workouts].sort((a,b)=>a.finishedAt-b.finishedAt)){
    const inWeek=w.finishedAt>=wkStart;
    for(const en of w.exs){
      const ex=S.ex.get(en.exId);
      if(!ex)continue;
      const b=best[en.exId]||(best[en.exId]={w:0,e1:0,typed:0,dur:0,dist:0,seen:false});
      // this entry's top numbers
      let tw=0,te1=0,ttyped=0,tdur=0,tdist=0,valid=false;
      for(const st of en.sets){
        if(st.t==='W')continue;
        if(isCardio(ex)){
          if(st.dur>0||st.dist>0){
            valid=true;
            if((st.dur||0)>tdur)tdur=st.dur||0;
            if((st.dist||0)>tdist)tdist=st.dist||0;
          }
        }else{
          const wt=loadOf(ex,st),r=st.r||0;
          if(wt>0&&r>0){
            valid=true;
            if(wt>tw)tw=wt;
            const e=epley(wt,r);
            if(e>te1)te1=e;
          }
          if(ex.e!=='Bodyweight'&&st.w&&st.w>ttyped)ttyped=st.w;
        }
      }
      if(!valid)continue;
      if(inWeek){
        if(isCardio(ex)){
          // first-ever session of an exercise isn't a "record" (matches live PR logic)
          if(b.seen){
            if(tdist>0&&tdist>b.dist+1e-9)out.push({ts:w.finishedAt,kind:'dist',ex,v:tdist});
            if(tdur>0&&tdur>b.dur+1e-9)out.push({ts:w.finishedAt,kind:'dur',ex,v:tdur});
          }
        }else{
          const club=ttyped?milestoneFor(ttyped,b.typed||null):null;
          if(club!=null)out.push({ts:w.finishedAt,kind:'club',ex,v:club});
          else if(b.seen){   // club joins headline the lift; else one PR line per session
            if(tw>b.w+1e-9)out.push({ts:w.finishedAt,kind:'weight',ex,v:tw});
            else if(te1>b.e1+1e-9)out.push({ts:w.finishedAt,kind:'e1rm',ex,v:te1});
          }
        }
      }
      b.w=Math.max(b.w,tw);b.e1=Math.max(b.e1,te1);b.typed=Math.max(b.typed,ttyped);
      b.dur=Math.max(b.dur,tdur);b.dist=Math.max(b.dist,tdist);
      b.seen=true;
    }
  }
  return out.sort((a,b)=>b.ts-a.ts);
}
function dayPhrase(ts){
  const t0=new Date();t0.setHours(0,0,0,0);
  const d=new Date(ts);d.setHours(0,0,0,0);
  const dd=Math.round((t0.getTime()-d.getTime())/864e5);
  if(dd<=0)return'Today';
  if(dd===1)return'Yesterday';
  return'This week on '+new Date(ts).toLocaleDateString(undefined,{weekday:'long'});
}
let PRB_OPEN=false;
function prBoardCard(){

    else if(p.kind==='dist'){icon='🗺️';kids=[day+', your furthest '+p.ex.name+' ever — ',h('b',{},fmtW(p.v)+' '+distUnit()),'.'];}
